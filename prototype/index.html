<title>Zynqora</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --bg: #F4F4F6;
    --app-bg: #F7F7F9;
    --surface: #FFFFFF;
    --surface-2: #FBFBFC;
    --elevated: #FFFFFF;
    --ink: #1C1C21;
    --ink-2: #43434D;
    --muted: #73737F;
    --faint: #9A9AA4;
    --border: #E8E8EC;
    --border-2: #DCDCE2;
    --tint-bg: #FFFFFF;
    --tint-border: #E8E8EC;
    --accent: #5A54C9;
    --accent-press: #4B45B6;
    --accent-soft: color-mix(in srgb, var(--accent) 11%, var(--tint-bg));
    --accent-line: color-mix(in srgb, var(--accent) 32%, var(--tint-border));
    --good: #3C8C6D;
    --good-soft: #E3F1EB;
    --attn: #AE7A38;
    --attn-soft: #F3EBDD;
    --danger: #B4443B;
    --danger-soft: #F5E6E4;
    --shadow-xs: 0 1px 2px rgba(22,22,28,.04);
    --shadow-sm: 0 1px 2px rgba(22,22,28,.05), 0 2px 6px rgba(22,22,28,.03);
    --shadow-md: 0 2px 4px rgba(22,22,28,.04), 0 8px 24px -12px rgba(22,22,28,.12);
    --shadow-lg: 0 4px 8px rgba(22,22,28,.05), 0 28px 56px -22px rgba(22,22,28,.18);
    --r-xs: 8px;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 18px;
    --r-full: 999px;
    --font: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(.22, .61, .36, 1);
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F0F13;
      --app-bg: #121216;
      --surface: #1A1A1F;
      --surface-2: #1D1D23;
      --elevated: #232329;
      --ink: #F1F1F4;
      --ink-2: #C7C7D0;
      --muted: #93939F;
      --faint: #696975;
      --border: #292930;
      --border-2: #35353E;
      --tint-bg: #17171D;
      --tint-border: #2A2A31;
      --accent: #8E8BF3;
      --accent-press: #A09CF6;
      --accent-soft: color-mix(in srgb, var(--accent) 15%, var(--tint-bg));
      --accent-line: color-mix(in srgb, var(--accent) 30%, var(--tint-border));
      --good: #55B590;
      --good-soft: #15271F;
      --attn: #C89A5D;
      --attn-soft: #291F12;
      --danger: #D2726A;
      --danger-soft: #2B1613;
      --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
      --shadow-md: 0 2px 6px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.55);
      --shadow-lg: 0 3px 10px rgba(0,0,0,.45), 0 32px 60px -24px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F0F13;
    --app-bg: #121216;
    --surface: #1A1A1F;
    --surface-2: #1D1D23;
    --elevated: #232329;
    --ink: #F1F1F4;
    --ink-2: #C7C7D0;
    --muted: #93939F;
    --faint: #696975;
    --border: #292930;
    --border-2: #35353E;
    --tint-bg: #17171D;
    --tint-border: #2A2A31;
    --accent: #8E8BF3;
    --accent-press: #A09CF6;
    --accent-soft: color-mix(in srgb, var(--accent) 15%, var(--tint-bg));
    --accent-line: color-mix(in srgb, var(--accent) 30%, var(--tint-border));
    --good: #55B590;
    --good-soft: #15271F;
    --attn: #C89A5D;
    --attn-soft: #291F12;
    --danger: #D2726A;
    --danger-soft: #2B1613;
    --shadow-xs: 0 1px 2px rgba(0,0,0,.3);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
    --shadow-md: 0 2px 6px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.55);
    --shadow-lg: 0 3px 10px rgba(0,0,0,.45), 0 32px 60px -24px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }
  .seg button, .segbig button, .btn { text-align: center; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }
  input, textarea { font: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 999px; border: 3px solid var(--bg); }

  /* ---------- stage + frame (responsive: real device size decides, no manual switch) ---------- */
  .stage { display: flex; justify-content: center; align-items: flex-start; padding: 0; min-height: 100vh; }
  .frame {
    container-type: inline-size; position: relative; width: 100%;
    background: var(--app-bg); overflow: hidden; display: flex; flex-direction: column;
    max-width: none; height: 100vh; border: none; border-radius: 0;
  }
  .screen-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .screen-scroll.lockscroll { overflow: hidden; }
  .screen-scroll.lockscroll > .view { height: 100%; }

  /* En pantalla grande el "frame" ocupa todo el ancho (no una tarjeta de móvil
     flotando en medio) — así el @container de abajo activa el layout de
     escritorio (sidenav) en vez de quedarse en el layout de móvil. */

  .view-enter { animation: viewIn .42s var(--ease-out); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(9px); } }

  /* ---------- app layout ---------- */
  .app { display: flex; min-height: 100%; }
  .sidenav {
    display: none; flex-direction: column; gap: 2px; width: 236px; flex-shrink: 0;
    padding: 24px 14px; border-right: 1px solid var(--border); background: var(--surface);
  }
  .sidenav .brand { display: flex; align-items: center; gap: 9px; padding: 6px 10px 22px; font-weight: 600; font-size: 16px; letter-spacing: -.015em; }
  .sidenav .brand .mk { width: 20px; height: 20px; color: var(--accent); }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--r-sm);
    color: var(--muted); font-size: 13.5px; font-weight: 500; transition: color .15s, background .15s;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { color: var(--ink); background: var(--surface-2); }
  .nav-item.on { color: var(--accent); background: var(--accent-soft); }
  .nav-spacer { flex: 1; }
  .nav-ai {
    display: flex; align-items: center; gap: 10px; padding: 10px 11px; margin: 6px 0;
    border-radius: var(--r-sm); border: 1px solid var(--accent-line); background: var(--accent-soft);
    color: var(--accent); font-size: 13px; font-weight: 600; transition: transform .12s var(--ease);
  }
  .nav-ai:hover { transform: translateY(-1px); }
  .nav-ai svg { width: 16px; height: 16px; }
  .nav-foot { display: flex; align-items: center; gap: 10px; padding: 10px; margin-top: 4px; border-radius: var(--r-sm); border: 1px solid var(--border); }
  .nav-foot .av { width: 28px; height: 28px; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .nav-foot .nm { font-size: 12.5px; font-weight: 500; line-height: 1.2; }
  .nav-foot .pl { font-size: 11px; color: var(--faint); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .bottomnav {
    position: sticky; bottom: 0; z-index: 30; display: flex; justify-content: space-around;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
  }
  .bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 10px; border-radius: var(--r-sm); color: var(--faint); font-size: 10.5px; font-weight: 500; }
  .bn-item svg { width: 21px; height: 21px; }
  .bn-item.on { color: var(--accent); }

  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: color-mix(in srgb, var(--app-bg) 86%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid transparent;
  }
  .topbar.bordered { border-color: var(--border); }
  .topbar .back { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--r-full); color: var(--ink-2); flex-shrink: 0; }
  .topbar .back:hover { background: var(--surface-2); }
  .topbar h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .topbar .tb-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .tb-ai {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: var(--r-full);
    border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent);
    font-size: 12px; font-weight: 600; transition: transform .12s var(--ease);
  }
  .tb-ai:hover { transform: translateY(-1px); }
  .tb-ai svg { width: 14px; height: 14px; }

  .wrap { padding: 20px; max-width: 780px; margin: 0 auto; width: 100%; }
  .wrap.wide { max-width: 1120px; }

  @container (min-width: 720px) {
    .sidenav { display: flex; }
    .bottomnav { display: none; }
    .wrap { padding: 34px 44px; }
    .topbar { padding: 22px 44px; }
    .tb-ai-mobile { display: none; }
  }
  @container (max-width: 719px) {
    .tb-ai span { display: none; }
    .tb-ai { padding: 0 9px; }
    .topbar h1 { font-size: 14px; }
    .subj-btn { max-width: 130px; }
    .subj-btn > :not(svg):not(.sc) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }
  @container (min-width: 1060px) {
    .wrap { padding: 44px 60px; }
    .topbar { padding: 28px 60px; }
  }

  /* ---------- components ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px;
    border-radius: var(--r-sm); font-size: 14px; font-weight: 500; letter-spacing: -.005em;
    transition: transform .12s var(--ease), background .15s, box-shadow .15s, border-color .15s, opacity .15s; white-space: nowrap;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-xs); }
  .btn-primary:hover { background: var(--accent-press); }
  :root[data-theme="dark"] .btn-primary { color: #16161c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #16161c; } }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--border-2); }
  .btn-secondary:hover { background: var(--surface-2); border-color: var(--faint); }
  .btn-ghost { color: var(--muted); padding: 0 12px; }
  .btn-ghost:hover { color: var(--ink); background: var(--surface-2); }
  .btn-block { width: 100%; }
  .btn-lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: var(--r-md); }
  .btn-sm { height: 34px; padding: 0 13px; font-size: 13px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px; box-shadow: var(--shadow-xs); }
  .card-lg { padding: 24px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .h-page { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
  .h-sec { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .txt-muted { color: var(--muted); }
  .txt-sm { font-size: 13px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  p.body { color: var(--ink-2); line-height: 1.62; }

  .pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-full); font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .pill.attn { background: var(--attn-soft); color: var(--attn); border-color: transparent; }
  .pill .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }

  .bar { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s var(--ease-out); }
  .bar.thin { height: 4px; }

  .field {
    width: 100%; height: 44px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border-2);
    border-radius: var(--r-sm); font-size: 14px; color: var(--ink); transition: border-color .15s, box-shadow .15s;
  }
  .field::placeholder { color: var(--faint); }
  textarea.field { height: auto; min-height: 62px; padding: 10px 14px; line-height: 1.45; resize: vertical; font-family: inherit; }
  .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin-bottom: 7px; display: block; }

  .row { display: flex; align-items: center; gap: 12px; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack { display: flex; flex-direction: column; }
  .grid { display: grid; gap: 14px; }
  .divide > * + * { border-top: 1px solid var(--border); }

  .list-row { display: flex; align-items: center; gap: 13px; padding: 14px 0; }
  .list-row .ic { width: 36px; height: 36px; border-radius: var(--r-sm); flex-shrink: 0; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
  .list-row .ic svg { width: 18px; height: 18px; }
  .list-row .gr { flex: 1; min-width: 0; }
  .list-row .tt { display: block; font-size: 14px; font-weight: 500; letter-spacing: -.005em; }
  .list-row .sb { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .list-row .ch { color: var(--faint); flex-shrink: 0; }
  .list-row.tap { transition: background .12s; border-radius: var(--r-xs); }
  .list-row.tap:hover { cursor: pointer; background: var(--surface-2); }
  .list-row.tap:hover .tt { color: var(--accent); }

  .subject-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }

  .ring { position: relative; }
  .ring svg { transform: rotate(-90deg); overflow: visible; }
  .ring .rt { fill: none; stroke: var(--border-2); }
  .ring .rf { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s var(--ease-out); }
  .ring .rc { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }

  .toast {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    padding: 11px 16px; border-radius: var(--r-md); background: var(--elevated); border: 1px solid var(--border);
    box-shadow: var(--shadow-lg); font-size: 13px; font-weight: 500; z-index: 50; animation: toastIn .4s var(--ease-out);
  }
  .toast svg { width: 16px; height: 16px; color: var(--good); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }

  .skel { background: var(--border); border-radius: var(--r-xs); position: relative; overflow: hidden; }
  .skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 55%, transparent), transparent); animation: shimmer 1.5s infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .empty { text-align: center; padding: 44px 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty .eic { width: 52px; height: 52px; border-radius: var(--r-md); margin-bottom: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .empty .eic svg { width: 24px; height: 24px; }
  .empty h3 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .empty p { font-size: 13px; color: var(--muted); max-width: 34ch; }

  /* flashcard */
  .fc-scene { perspective: 1800px; }
  .fc { position: relative; width: 100%; aspect-ratio: 3 / 2.1; transform-style: preserve-3d; transition: transform .6s var(--ease-out); cursor: pointer; }
  .fc.flipped { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 28px; display: flex; flex-direction: column; }
  .fc-back { transform: rotateY(180deg); }
  .fc-face .ft { margin: auto 0; font-size: 19px; font-weight: 500; letter-spacing: -.01em; line-height: 1.42; }
  .fc-back .ft { font-weight: 400; font-size: 15.5px; color: var(--ink-2); line-height: 1.55; }
  .fc-face .fh { display: flex; justify-content: space-between; align-items: center; }
  .fc-face .hint { font-size: 11.5px; color: var(--faint); text-align: center; margin-top: 10px; }

  /* option */
  .option { display: flex; align-items: center; gap: 13px; width: 100%; padding: 15px 16px; text-align: left; background: var(--surface); border: 1px solid var(--border-2); border-radius: var(--r-md); font-size: 14px; font-weight: 450; transition: border-color .15s, background .15s, transform .1s var(--ease); }
  .option:hover:not(:disabled) { border-color: var(--faint); }
  .option:active:not(:disabled) { transform: translateY(1px); }
  .option .key { width: 26px; height: 26px; border-radius: var(--r-xs); flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
  .option.correct { border-color: var(--good); background: var(--good-soft); }
  .option.correct .key { background: var(--good); color: #fff; border-color: transparent; }
  .option.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .option.wrong .key { background: var(--danger); color: #fff; border-color: transparent; }
  .option:disabled { cursor: default; }

  /* AI insight block */
  .ai-block { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r-md); padding: 15px 17px; }
  .ai-block .ah { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .ai-block .ah svg { width: 13px; height: 13px; }

  /* contextual AI link */
  .ai-link {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: var(--r-full);
    border: 1px solid var(--accent-line); background: transparent; color: var(--accent);
    font-size: 12.5px; font-weight: 500; transition: background .15s, transform .12s var(--ease);
  }
  .ai-link:hover { background: var(--accent-soft); transform: translateY(-1px); }
  .ai-link svg { width: 14px; height: 14px; }

  /* analysis */
  .an-step { display: flex; align-items: center; gap: 12px; padding: 12px 0; opacity: .35; transform: translateY(4px); transition: opacity .4s var(--ease-out), transform .4s var(--ease-out); }
  .an-step.in { opacity: 1; transform: none; }
  .an-step .dot { width: 24px; height: 24px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center; border: 1.5px solid var(--border-2); color: var(--faint); }
  .an-step .dot svg { width: 13px; height: 13px; }
  .an-step.done .dot { border-color: var(--good); background: var(--good); color: #fff; }
  .an-step.active .dot { border-color: var(--accent); color: var(--accent); }
  .an-step .tt { font-size: 13.5px; font-weight: 500; }
  .an-spin { width: 15px; height: 15px; border: 2px solid var(--accent-line); border-top-color: var(--accent); border-radius: 999px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .metricgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .metric { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 13px 14px; }
  .metric b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .metric span { font-size: 12px; color: var(--muted); }

  /* AI chat */
  .chat { display: flex; flex-direction: column; height: 100%; min-height: 100%; width: 100%; }
  .chat-scroll { min-height: 0; }
  @container (min-width: 720px) {

  .choice { display: flex; align-items: center; gap: 12px; padding: 15px 16px; border-radius: var(--r-md); border: 1px solid var(--border-2); background: var(--surface); font-size: 14px; font-weight: 450; cursor: pointer; transition: border-color .15s, background .15s; }

  .dropzone.hot { border-color: var(--accent); background: var(--accent-soft); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  .fade-in { animation: fadeIn .32s var(--ease-out); }

  /* ---- Fase 0.7 additions ---- */
  .rise { animation: rise .4s var(--ease-out) both; }

  .stagger > * { animation: rise .42s var(--ease-out) both; }
  .stagger > *:nth-child(1){animation-delay:.02s} .stagger > *:nth-child(2){animation-delay:.06s}
  .stagger > *:nth-child(3){animation-delay:.1s} .stagger > *:nth-child(4){animation-delay:.14s}
  .stagger > *:nth-child(5){animation-delay:.18s} .stagger > *:nth-child(6){animation-delay:.22s}
  .stagger > *:nth-child(7){animation-delay:.26s} .stagger > *:nth-child(8){animation-delay:.3s}

  /* subject switcher */

  /* ---- Fase 0.9 additions ---- */
  .chat-ctx-wrap { position: relative; margin: 12px 20px 0; }
  .chat-ctx { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: var(--r-full); background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); font-size: 12px; font-weight: 500; cursor: pointer; transition: background .15s; }
  .chat-ctx:hover { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
  .chat-ctx svg { width: 12px; height: 12px; flex-shrink: 0; }
  .ctx-pop { position: absolute; left: 20px; top: calc(100% + 6px); z-index: 30; width: 230px; background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-lg); padding: 6px; }
  .ctx-pop button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 9px 10px; border-radius: var(--r-xs); font-size: 13px; color: var(--ink-2); }
  .ctx-pop button:hover { background: var(--surface-2); color: var(--ink); }
  .ctx-pop button.on { background: var(--accent-soft); color: var(--accent); }
  .ctx-pop .sc { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .ai-quiz { margin-top: 12px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
  .aq-q { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  .aq-opts { display: flex; flex-direction: column; gap: 7px; }
  .aq-opt { display: block; text-align: left; padding: 9px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-2); background: var(--surface); font-size: 13px; transition: border-color .14s, background .14s; }
  button.aq-opt:hover { border-color: var(--accent); }
  .aq-opt.correct { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 500; }
  .aq-opt.wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }

  /* learning path */
  .path-node { display: flex; gap: 14px; }
  .path-node .pn-rail { display: flex; flex-direction: column; align-items: center; }
  .path-node .pn-dot {
    width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center;
    border: 2px solid var(--border-2); background: var(--surface); color: var(--faint); font-weight: 600; font-size: 15px;
    transition: transform .18s var(--ease);
  }
  .path-node .pn-dot svg { width: 19px; height: 19px; }
  .path-node .pn-line { width: 2px; flex: 1; background: var(--border-2); min-height: 22px; margin: 4px 0; border-radius: 2px; }
  .path-node.done .pn-dot { border-color: var(--good); background: var(--good); color: #fff; }
  .path-node.current .pn-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .path-node.locked { opacity: .55; }
  .path-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 15px 16px;
    box-shadow: var(--shadow-xs); margin-bottom: 8px; transition: transform .14s var(--ease), border-color .15s, box-shadow .15s;
  }
  button.path-card:hover { transform: translateY(-2px); border-color: var(--accent-line); box-shadow: var(--shadow-md); }
  .path-card .pc-k { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .path-card.current .pc-k { color: var(--accent); }
  .path-card .pc-t { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin-top: 3px; }
  .path-card .pc-s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  /* review modes */
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .mode-card {
    display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--border-2); border-radius: var(--r-md);
    background: var(--surface); text-align: left; transition: border-color .14s, transform .12s var(--ease), box-shadow .15s;
  }
  .mode-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .mode-card .mc-i { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .mode-card .mc-i svg { width: 19px; height: 19px; }
  .mode-card b { font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .mode-card span { font-size: 12px; color: var(--muted); }
  .mode-card .rec { align-self: flex-start; font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; }

  /* fill in the blank */
  .fib-sentence { font-size: 18px; line-height: 1.6; letter-spacing: -.01em; }
  .fib-blank { display: inline-block; min-width: 90px; border-bottom: 2px solid var(--accent); margin: 0 4px; }
  .fib-input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border-2); border-radius: var(--r-sm); font-size: 15px; background: var(--surface); color: var(--ink); text-align: center; }
  .fib-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .fib-input.ok { border-color: var(--good); background: var(--good-soft); }
  .fib-input.bad { border-color: var(--danger); background: var(--danger-soft); }

  /* streak celebration */
  .celebrate {
    position: absolute; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--app-bg) 70%, transparent); backdrop-filter: blur(3px); animation: fadeIn .2s;
  }
  .celebrate .cbox {
    background: var(--elevated); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 26px 30px; text-align: center;
    box-shadow: var(--shadow-lg); animation: pop .5s var(--ease-out);
  }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
  .celebrate .cflame { font-size: 44px; line-height: 1; display: block; animation: flamePulse 1s var(--ease) infinite alternate; }
  @keyframes flamePulse { to { transform: scale(1.12); } }
  .celebrate .ctitle { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin-top: 8px; }
  .celebrate .csub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* profile avatar edit */
  .avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px; }
  .avatar-presets { display: flex; gap: 10px; flex-wrap: wrap; }
  .avatar-presets button { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; transition: transform .12s var(--ease); }
  .avatar-presets button:hover { transform: scale(1.08); }
  .avatar-presets button.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

  /* ---- Fase 1.0 additions ---- */
  .plan-toggle { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-full); padding: 3px; margin-bottom: 20px; }
  .plan-toggle button { padding: 7px 16px; font-size: 12.5px; font-weight: 500; color: var(--muted); border-radius: var(--r-full); transition: color .15s, background .15s; }
  .plan-toggle button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-xs); }
  .plans-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @container (min-width: 800px) { .plans-grid { grid-template-columns: repeat(3, 1fr); align-items: start; } }
  .plan-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow-xs); transition: border-color .15s, box-shadow .15s, transform .12s var(--ease); }
  .plan-card.popular { border-color: var(--accent-line); box-shadow: var(--shadow-md); }
  .plan-card.current { border-color: var(--good); }
  .plan-badge { position: absolute; top: -11px; left: 22px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: var(--r-full); letter-spacing: -.005em; }
  :root[data-theme="dark"] .plan-badge { color: #16161c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .plan-badge { color: #16161c; } }
  .plan-card .pc-name { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .plan-card .pc-tag { font-size: 11.5px; color: var(--accent); font-weight: 500; margin-top: 3px; min-height: 15px; }
  .plan-card .pc-price { display: flex; align-items: baseline; gap: 4px; margin-top: 12px; }
  .plan-card .pc-price .amt { font-size: 25px; font-weight: 600; letter-spacing: -.02em; }
  .plan-card .pc-price .per { font-size: 13px; color: var(--muted); }
  .plan-card .pc-save { font-size: 11.5px; color: var(--good); min-height: 15px; margin-top: 4px; }
  .plan-card .pc-feats { list-style: none; margin: 16px 0; display: flex; flex-direction: column; gap: 9px; }
  .plan-card .pc-feats li { display: flex; gap: 9px; font-size: 12.5px; color: var(--ink-2); align-items: flex-start; }
  .plan-card .pc-feats li svg { width: 14px; height: 14px; color: var(--good); flex-shrink: 0; margin-top: 2px; }
  .plan-card .pc-feats li b { font-weight: 600; color: var(--ink); }

  .usage-list { display: flex; flex-direction: column; gap: 14px; }
  .usage-item .bar.thin { background: var(--border); }

  .up-ic { width: 46px; height: 46px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 12px; font-size: 22px; }
  .up-ic svg { width: 22px; height: 22px; }

  .co-card { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border: 1px dashed var(--border-2); border-radius: var(--r-sm); color: var(--muted); font-size: 12.5px; font-family: var(--mono); letter-spacing: .04em; }
  .co-card svg { width: 16px; height: 16px; flex-shrink: 0; }

  .nutshell-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
  @container (min-width: 620px) { .nutshell-grid { grid-template-columns: 1fr 1fr; } }
  .nut-t { font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .nut-d { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .pol-acc { border-top: 1px solid var(--border); }
  .pol-acc:first-child { border-top: none; }
  .pol-acc-h { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 0; font-size: 13.5px; font-weight: 500; color: var(--ink); text-align: left; }
  .pol-acc-h svg { width: 16px; height: 16px; color: var(--faint); transition: transform .2s var(--ease); flex-shrink: 0; }
  .pol-acc.open .pol-acc-h svg { transform: rotate(180deg); }
  .pol-acc-b { font-size: 12.5px; color: var(--ink-2); line-height: 1.62; padding: 0 0 16px; animation: fadeIn .2s; }

  .tool-card { display: flex; align-items: center; gap: 13px; padding: 15px 16px; border: 1px solid var(--border-2); border-radius: var(--r-md); background: var(--surface); text-align: left; transition: border-color .14s, transform .12s var(--ease), box-shadow .15s; }
  .tool-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .tool-card .tc-i { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
  .tool-card .tc-i svg { width: 19px; height: 19px; }
  .tool-card .tc-g { flex: 1; min-width: 0; }
  .tool-card .tc-g b { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: -.01em; }
  .tool-card .tc-g span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .tool-card .tc-lock { color: var(--faint); flex-shrink: 0; }
  .tf-steps { display: flex; gap: 8px; margin-bottom: 16px; }
  .tf-steps span { flex: 1; text-align: center; font-size: 11px; font-weight: 500; color: var(--faint); padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .tf-steps span.on { color: var(--accent); border-color: var(--accent); }
  .tf-preview { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 34px 20px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-md); margin-top: 12px; }
  .tf-preview svg { width: 26px; height: 26px; color: var(--accent); }
  .tf-preview p { font-size: 12.5px; max-width: 34ch; }

  .ai-fc { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; margin: 10px 0; }
  .ai-fc-q { padding: 11px 13px; font-weight: 600; font-size: 12.5px; background: var(--surface-2); color: var(--ink); }
  .ai-fc-a { padding: 11px 13px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--border); }
  .msg-ai .abody ol { margin: 6px 0 6px 2px; padding-left: 18px; }

  .accent-pick button.locked { opacity: .38; }
  .accent-pick button.locked::before { content: ""; position: absolute; inset: 0; border-radius: 999px; }

  /* ---- Fase 1.1 additions ---- */
  /* sidenav: always pinned & fully visible regardless of content height */
  .sidenav { position: sticky; top: 0; align-self: flex-start; max-height: 100vh; overflow-y: auto; }
  .sidenav::-webkit-scrollbar { width: 0; }
  .nav-foot { transition: border-color .15s, background .15s; }
  .nav-foot:hover { border-color: var(--faint); background: var(--surface-2); }
  .nav-foot .pl { color: var(--accent); font-weight: 600; }

  /* checkout panel */
  .co-panel { max-width: 460px; margin: 0 auto; }
  .co-sum { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 15px 16px; }
  .co-sum .cs-p { font-size: 13px; color: var(--muted); }
  .co-sum .cs-plan { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin-top: 3px; }
  .co-sum .cs-amt { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-top: 8px; }
  .co-methods { display: flex; gap: 8px; margin: 16px 0 4px; }
  .co-methods button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid var(--border-2); border-radius: var(--r-sm); font-size: 13px; font-weight: 500; color: var(--ink-2); background: var(--surface); transition: border-color .14s, background .14s; }
  .co-methods button svg { width: 15px; height: 15px; }
  .co-methods button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .co-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
  .co-fields .full { grid-column: 1 / -1; }
  .co-sim { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 11.5px; color: var(--muted); margin-top: 12px; }
  .co-paypal { text-align: center; padding: 26px 16px; background: var(--surface-2); border: 1px dashed var(--border-2); border-radius: var(--r-md); font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* generating animation */
  .tf-gen { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 44px 20px; }
  .tf-gen .orb { width: 60px; height: 60px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; position: relative; animation: orbPulse 1.4s var(--ease) infinite; }
  .tf-gen .orb svg { width: 26px; height: 26px; }
  .tf-gen .orb::after { content: ""; position: absolute; inset: -6px; border-radius: 999px; border: 2px solid var(--accent-line); animation: orbRing 1.4s var(--ease) infinite; }
  @keyframes orbPulse { 50% { transform: scale(1.06); } }
  @keyframes orbRing { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.3); } }
  .tf-gen .gt { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .tf-gen .gbar { width: 160px; height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .tf-gen .gbar i { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 999px; animation: genSlide 1.3s var(--ease-out) infinite; }
  @keyframes genSlide { from { transform: translateX(-120%); } to { transform: translateX(320%); } }

  /* generation step list */
  .gen-steps { display: flex; flex-direction: column; gap: 4px; margin-top: 18px; width: 100%; max-width: 300px; }
  .gen-steps .gs { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--faint); padding: 4px 0; transition: color .3s; }
  .gen-steps .gs .gsd { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid var(--border-2); flex-shrink: 0; display: grid; place-items: center; }
  .gen-steps .gs .gsd svg { width: 10px; height: 10px; }
  .gen-steps .gs.done { color: var(--ink-2); }
  .gen-steps .gs.done .gsd { border-color: var(--good); background: var(--good); color: #fff; }
  .gen-steps .gs.active { color: var(--ink); font-weight: 500; }
  .gen-steps .gs.active .gsd { border-color: var(--accent); }
  .gen-steps .gs.active .gsd::after { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--accent); animation: orbPulse 1s infinite; }

  /* ============ Fase 1.2 — podcast player + presentation deck ============ */
  .pod-shell { max-width: 460px; margin: 0 auto; }
  .pod-cover { position: relative; border-radius: var(--r-lg); padding: 26px 22px 22px; color: #fff; overflow: hidden; box-shadow: var(--shadow-md); text-align: left; }
  .pod-cover[data-subj="hist"] { background: linear-gradient(150deg, #8a5a2c, #3a2417); }
  .pod-cover[data-subj="bio"]  { background: linear-gradient(150deg, #4b46b8, #201d52); }
  .pod-cover[data-subj="mat"]  { background: linear-gradient(150deg, #2f8f6f, #123f30); }
  .pod-cover[data-subj="eco"]  { background: linear-gradient(150deg, #3f68b0, #1b2c52); }
  .pod-cover[data-subj="_"]    { background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #000)); }
  .pod-cover .pc-art { position: absolute; right: -14px; bottom: -14px; width: 128px; height: 128px; opacity: .16; color: #fff; }
  .pod-cover .pc-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; background: rgba(255,255,255,.16); padding: 4px 9px; border-radius: 999px; }
  .pod-cover .pc-title { position: relative; font-size: 21px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-top: 14px; text-wrap: balance; }
  .pod-cover .pc-sub { position: relative; font-size: 12.5px; opacity: .85; margin-top: 6px; }
  .pod-cover .pc-by { position: relative; font-size: 10.5px; opacity: .7; margin-top: 14px; letter-spacing: .03em; }

  .pod-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; margin-top: 14px; box-shadow: var(--shadow-xs); }
  .pod-scrub { height: 6px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; }
  .pod-scrub i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; }
  .pod-scrub .pk { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 999px; background: var(--accent); transform: translate(-50%, -50%); box-shadow: var(--shadow-sm); }
  .pod-time { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 7px; }
  .pod-transport { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 12px; }
  .pod-tb { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-2); border: 1px solid var(--border-2); transition: background .14s, border-color .14s; }
  .pod-tb:hover { background: var(--surface-2); border-color: var(--faint); }
  .pod-tb svg { width: 17px; height: 17px; }
  .pod-play { width: 58px; height: 58px; border-radius: 999px; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: transform .12s var(--ease); border: none; }
  :root[data-theme="dark"] .pod-play { color: #16161c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pod-play { color: #16161c; } }
  .pod-play:hover { transform: scale(1.05); }
  .pod-play:active { transform: scale(.96); }
  .pod-play svg { width: 22px; height: 22px; }
  .pod-row2 { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .pod-speed { display: flex; gap: 5px; flex-wrap: wrap; }
  .pod-speed button { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border-2); font-size: 11px; font-weight: 500; font-family: var(--mono); color: var(--ink-2); transition: border-color .14s, color .14s, background .14s; }
  .pod-speed button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .pod-vol { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); flex-shrink: 0; }
  .pod-vol svg { width: 16px; height: 16px; }
  .pod-vol input[type="range"] { -webkit-appearance: none; appearance: none; width: 78px; height: 4px; border-radius: 999px; background: var(--border); outline: none; }
  .pod-vol input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 999px; background: var(--accent); cursor: pointer; }
  .pod-vol input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border: none; border-radius: 999px; background: var(--accent); cursor: pointer; }

  .pod-transcript { margin-top: 14px; }
  .ptr-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }

  .ptr-line { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.5; color: var(--muted); transition: background .15s, color .15s; }

  .pod-note { display: flex; align-items: flex-start; gap: 8px; font-size: 11px; color: var(--faint); margin-top: 12px; line-height: 1.45; }

  /* config option cards (approach / voice / style) */
  .cfg-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .cfg-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 13px 8px; border: 1px solid var(--border-2); border-radius: var(--r-md); background: var(--surface); text-align: center; transition: border-color .14s, background .14s, transform .1s var(--ease); }

  .cfg-card span { font-size: 10.5px; color: var(--muted); }

  .cfg-2 { grid-template-columns: 1fr 1fr; }

  /* ---------- presentation deck ---------- */
  .deck { max-width: 560px; margin: 0 auto; }
  .pres-stage { position: relative; border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-md); }
  .pres-slide { aspect-ratio: 16 / 10; padding: 30px; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  @keyframes slideIn { from { opacity: 0; transform: translateY(10px) scale(.985); } }
  .pres-slide .ps-kicker { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .55; position: relative; z-index: 2; animation: psRise .5s var(--ease-out) both .04s; }
  .pres-slide .ps-kdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .pres-slide .ps-title { font-size: 25px; font-weight: 600; letter-spacing: -.025em; line-height: 1.12; margin-top: 10px; text-wrap: balance; position: relative; z-index: 2; animation: psRise .5s var(--ease-out) both .1s; }
  .pres-slide .ps-sub { font-size: 13.5px; opacity: .78; margin-top: 8px; line-height: 1.5; position: relative; z-index: 2; animation: psRise .5s var(--ease-out) both .16s; }
  .pres-slide .ps-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; position: relative; z-index: 2; animation: psRise .5s var(--ease-out) both .16s; }
  .pres-slide .ps-tag { font-size: 10.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; background: rgba(127,127,127,.14); }
  .pres-slide .ps-body { margin-top: auto; position: relative; z-index: 2; animation: psRise .5s var(--ease-out) both .2s; }
  @keyframes psRise { from { opacity: 0; transform: translateY(8px); } }
  .pres-slide .ps-list { display: flex; flex-direction: column; gap: 10px; }
  .pres-slide .ps-list .pli { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; line-height: 1.4; }
  .pres-slide .ps-list .pli .pli-n { font-family: var(--mono); font-size: 9px; opacity: .4; flex-shrink: 0; width: 12px; padding-top: 6px; font-style: normal; }
  .pres-slide .ps-list .pli .pli-i { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center; background: currentColor; }
  .pres-slide .ps-list .pli .pli-i svg { width: 15px; height: 15px; opacity: 1; }
  .pres-slide .ps-list .pli .pli-i.pli-ok { background: rgba(31,162,92,.18) !important; color: #1fa25c !important; }
  .pres-slide .ps-hero { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 168px; height: 168px; opacity: .9; pointer-events: none; z-index: 1; }
  .pres-slide:has(.ps-hero) .ps-kicker, .pres-slide:has(.ps-hero) .ps-title, .pres-slide:has(.ps-hero) .ps-tags, .pres-slide:has(.ps-hero) .ps-sub { max-width: calc(100% - 120px); }
  .pres-slide .ps-hero.faint { opacity: .12; width: 220px; height: 220px; right: -20px; }
  .pres-slide .ps-fig { display: grid; place-items: center; margin: 6px 0; }
  .pres-slide .ps-fig svg { width: 100%; max-width: 260px; height: 120px; }
  .pres-slide .ps-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
  .pres-slide .ps-bg::before, .pres-slide .ps-bg::after { content: ""; position: absolute; border-radius: 50%; filter: blur(46px); background: var(--accent); }
  .pres-slide .ps-bg::before { width: 240px; height: 240px; right: -70px; top: -80px; opacity: .08; }
  .pres-slide .ps-bg::after { width: 200px; height: 200px; left: -60px; bottom: -70px; opacity: .05; }
  .pres-slide[data-st="0"] .ps-bg { display: none; }
  .pres-slide[data-st="1"] .ps-bg::before, .pres-slide[data-st="1"] .ps-bg::after { background: var(--ink); opacity: .035; }
  .pres-slide[data-st="2"] .ps-bg::before, .pres-slide[data-st="2"] .ps-bg::after { background: #8c6e3c; opacity: .14; }
  .pres-slide[data-st="3"] .ps-bg::before, .pres-slide[data-st="3"] .ps-bg::after { background: #fff; opacity: .16; }
  .pres-slide[data-st="4"] .ps-bg::before, .pres-slide[data-st="4"] .ps-bg::after { background: var(--accent); opacity: .22; }
  .pres-slide .ps-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(127,127,127,.16); font-size: 9.5px; opacity: .55; position: relative; z-index: 2; }
  .pres-slide .ps-brand { display: flex; align-items: center; gap: 4px; font-weight: 700; letter-spacing: .03em; }
  .pres-slide .ps-brand svg { width: 11px; height: 11px; }
  .pres-slide .ps-pageno { font-family: var(--mono); }
  .ps-quote { position: relative; padding: 16px 18px 14px 42px; border-left: 3px solid var(--accent); background: rgba(127,127,127,.07); border-radius: 0 var(--r-md) var(--r-md) 0; }
  .ps-quote p { font-size: 15px; line-height: 1.55; font-style: italic; margin: 0; }
  .ps-quote .ps-qmark { position: absolute; left: 10px; top: 0; font-size: 34px; line-height: 1; font-style: normal; opacity: .32; font-family: Georgia, serif; }
  .pres-tl { display: flex; flex-direction: column; }
  .pres-tl .ptl { display: flex; gap: 13px; padding: 6px 0; }
  .pres-tl .ptl .ptl-rail { display: flex; flex-direction: column; align-items: center; }
  .pres-tl .ptl .ptl-y { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: currentColor; flex-shrink: 0; }
  .pres-tl .ptl .ptl-y b { color: var(--surface); }
  .pres-tl .ptl .ptl-line { width: 2px; flex: 1; background: currentColor; opacity: .3; margin: 3px 0; min-height: 6px; }
  .pres-tl .ptl .ptl-t { font-size: 12.5px; line-height: 1.4; padding-top: 1px; }
  .pres-cmp { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pres-cmp .pcm { position: relative; border: 1px solid currentColor; border-radius: var(--r-md); padding: 14px 12px 12px; }
  .pres-cmp .pcm-badge { position: absolute; top: -8px; left: -8px; width: 20px; height: 20px; border-radius: 6px; background: currentColor; display: grid; place-items: center; font-size: 10px; font-weight: 800; box-shadow: 0 0 0 2px var(--surface); }
  .pres-cmp .pcm-badge b { color: var(--surface); font-style: normal; }
  .pres-cmp .pcm h4 { font-size: 12px; font-weight: 700; margin-bottom: 6px; }
  .pres-cmp .pcm p { font-size: 11.5px; line-height: 1.45; opacity: .85; }
  .pres-cmp::after { content: "VS"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-2); display: grid; place-items: center; font-size: 9px; font-weight: 800; letter-spacing: .04em; color: var(--muted); z-index: 2; }
  .pres-slide[data-st="3"] .pres-cmp::after, .pres-slide[data-st="4"] .pres-cmp::after { background: rgba(0,0,0,.35); border-color: rgba(255,255,255,.25); color: #fff; }
  .ps-hl { display: flex; align-items: center; gap: 16px; }
  .ps-hl .hl-ring { width: 74px; height: 74px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border: 2px solid currentColor; font-size: 25px; font-weight: 800; letter-spacing: -.02em; }
  .ps-hl .hl-list { flex: 1; min-width: 0; }

  .pres-slide[data-st="0"] { background: var(--surface); color: var(--ink); }
  .pres-slide[data-st="0"] .ps-list .pli .pli-i { background: var(--accent-soft); color: var(--accent); }
  .pres-slide[data-st="1"] { background: var(--surface); color: var(--ink); font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; }
  .pres-slide[data-st="1"] .ps-title { font-weight: 600; letter-spacing: -.01em; }
  .pres-slide[data-st="1"] .ps-kicker { border-bottom: 1px solid var(--border-2); padding-bottom: 8px; font-family: var(--font); }
  .pres-slide[data-st="1"] .ps-list .pli .pli-i { background: var(--surface-2); color: var(--ink-2); }
  .pres-slide[data-st="2"] { background: linear-gradient(160deg, #fbf7f0, #f3ede1); color: #3a2f22; }
  :root[data-theme="dark"] .pres-slide[data-st="2"] { background: linear-gradient(160deg, #2a2219, #191410); color: #efe6d6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pres-slide[data-st="2"] { background: linear-gradient(160deg, #2a2219, #191410); color: #efe6d6; } }
  .pres-slide[data-st="2"] .ps-title { font-size: 27px; }
  .pres-slide[data-st="2"] .ps-list .pli .pli-i { background: rgba(140,110,60,.18); color: currentColor; }
  .pres-slide[data-st="3"] { background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #101014)); color: #fff; }
  .pres-slide[data-st="3"] .ps-title { font-size: 28px; }
  .pres-slide[data-st="3"] .ps-list .pli .pli-i { background: rgba(255,255,255,.16); color: #fff; }
  .pres-slide[data-st="3"] .ps-hero:not(.faint) { opacity: 1; }
  .pres-slide[data-st="4"] { background: #14151a; color: #e9eaf0; }
  .pres-slide[data-st="4"] .ps-list .pli .pli-i { background: rgba(255,255,255,.1); color: #cfd1dc; }
  .pres-slide[data-st="4"] .ps-kicker { color: var(--accent); opacity: 1; }
  .pres-slide[data-st="3"] .ps-tag, .pres-slide[data-st="4"] .ps-tag { background: rgba(255,255,255,.16); }
  .pres-slide[data-st="3"] .hl-ring, .pres-slide[data-st="4"] .hl-ring { background: rgba(255,255,255,.16); color: #fff; }
  .pres-slide[data-st="3"] .ps-quote, .pres-slide[data-st="4"] .ps-quote { background: rgba(255,255,255,.08); border-left-color: rgba(255,255,255,.6); }
  .pres-slide[data-st="3"] .pcm-badge, .pres-slide[data-st="4"] .pcm-badge { box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
  .pres-slide[data-st="3"] .pcm-badge b, .pres-slide[data-st="4"] .pcm-badge b { color: #1a1a2e; }
  .pres-slide[data-st="3"] .ps-foot, .pres-slide[data-st="4"] .ps-foot { border-top-color: rgba(255,255,255,.16); }

  .pres-progress { display: flex; gap: 4px; margin-top: 12px; }
  .pres-progress i { flex: 1; height: 3px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .pres-progress i.on { background: var(--accent); }
  .pres-progress i.cur { background: var(--accent); position: relative; }
  .pres-toolbar { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .pres-toolbar .pt-b { width: 38px; height: 38px; border-radius: var(--r-sm); border: 1px solid var(--border-2); display: grid; place-items: center; color: var(--ink-2); transition: background .14s, border-color .14s; }
  .pres-toolbar .pt-b:hover:not(:disabled) { background: var(--surface-2); border-color: var(--faint); }
  .pres-toolbar .pt-b.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .pres-toolbar .pt-b:disabled { opacity: .35; }
  .pres-toolbar .pt-c { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 0 4px; }
  .pres-toolbar .sp { flex: 1; }
  .pres-thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; }
  .pres-thumb { flex: 0 0 92px; aspect-ratio: 16 / 10; border-radius: 8px; border: 1px solid var(--border-2); padding: 8px; font-size: 8px; line-height: 1.2; overflow: hidden; color: var(--ink-2); background: var(--surface); transition: border-color .14s, transform .1s var(--ease); text-align: left; }
  .pres-thumb:hover { border-color: var(--faint); }
  .pres-thumb.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .pres-thumb .tk { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .5; font-size: 6.5px; }
  .pres-thumb .tt { font-weight: 600; margin-top: 3px; font-size: 8.5px; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* present mode (pseudo-fullscreen) */
  .present-overlay { position: absolute; inset: 0; z-index: 90; background: #0c0c10; display: flex; flex-direction: column; animation: fadeIn .25s; }
  .present-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; color: rgba(255,255,255,.7); font-size: 12px; font-family: var(--mono); }
  .present-top button { width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: rgba(255,255,255,.8); }
  .present-top button:hover { background: rgba(255,255,255,.12); }
  .present-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 22px; min-height: 0; }
  .present-body .pres-stage { width: 100%; max-width: 900px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.6); }
  .present-body .pres-slide { aspect-ratio: 16 / 9; padding: min(6vw, 56px); }
  .present-body .pres-slide .ps-title { font-size: clamp(24px, 4.4vw, 44px); }
  .present-nav { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 14px; color: rgba(255,255,255,.8); }
  .present-nav button { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.2); color: #fff; }
  .present-nav button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .present-nav button:disabled { opacity: .3; }
  .present-nav .pn-c { font-family: var(--mono); font-size: 13px; }

  @container (max-width: 560px) {
    .pres-slide { padding: 22px; }
    .pres-slide .ps-title { font-size: 21px; }
    .pres-slide .ps-hero:not(.faint) { width: 96px; height: 96px; opacity: .8; }
    .pres-slide:has(.ps-hero) .ps-kicker, .pres-slide:has(.ps-hero) .ps-title, .pres-slide:has(.ps-hero) .ps-tags, .pres-slide:has(.ps-hero) .ps-sub { max-width: calc(100% - 70px); }
    .ps-tag { font-size: 9.5px; padding: 3px 9px; }
    .pres-thumbs { display: none; }
    .cfg-cards { grid-template-columns: 1fr; }
    .cfg-card { flex-direction: row; justify-content: flex-start; gap: 10px; text-align: left; padding: 12px; }
    .pod-row2 { flex-wrap: wrap; }
    .pod-vol { margin-left: 0; width: 100%; }
    .pod-vol input[type="range"] { flex: 1; width: auto; }
  }

  /* concept map */
  .cmap { position: relative; padding: 20px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cmap .cm-core { padding: 10px 16px; border-radius: var(--r-full); background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; text-align: center; }
  :root[data-theme="dark"] .cmap .cm-core { color: #16161c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cmap .cm-core { color: #16161c; } }
  .cmap .cm-branches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .cmap .cm-node { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--border-2); font-size: 12px; text-align: center; }

  /* material → IA actions */
  .mat-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @container (min-width: 620px) { .mat-actions { grid-template-columns: repeat(3, 1fr); } }
  .mat-act { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px; border: 1px solid var(--border-2); border-radius: var(--r-md); background: var(--surface); text-align: left; transition: border-color .14s, transform .12s var(--ease), box-shadow .15s; }
  .mat-act:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
  .mat-act .ma-i { width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .mat-act .ma-i svg { width: 17px; height: 17px; }
  .mat-act b { font-size: 12.5px; font-weight: 600; letter-spacing: -.01em; }
  .mat-act .ma-lock { font-size: 10px; color: var(--faint); font-weight: 600; }

  /* "¿qué quieres crear?" option */
  .qtc { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r-md); }
  .qtc .qi { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--accent); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
  :root[data-theme="dark"] .qtc .qi { color: #16161c; }

  .qtc .qi svg { width: 18px; height: 18px; }
  .qtc b { font-size: 13.5px; font-weight: 600; }
  .qtc span { font-size: 12px; color: var(--muted); display: block; margin-top: 1px; }

  /* profile */
  .prof-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .prof-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; text-align: center; }
  .prof-stat b { display: block; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
  .prof-stat span { font-size: 11.5px; color: var(--muted); }

  .opt-row { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
  .opt-pick { display: flex; align-items: center; gap: 11px; padding: 13px 15px; border: 1px solid var(--border-2); border-radius: var(--r-md); background: var(--surface); font-size: 13.5px; font-weight: 450; transition: border-color .14s, background .14s; }
  .opt-pick:hover { border-color: var(--faint); }
  .opt-pick.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .opt-pick .oc { width: 18px; height: 18px; border-radius: 999px; border: 1.5px solid var(--border-2); flex-shrink: 0; display: grid; place-items: center; }
  .opt-pick.on .oc { border-color: var(--accent); background: var(--accent); }
  .opt-pick.on .oc::after { content: ""; width: 7px; height: 7px; border-radius: 999px; background: #fff; }
  .opt-pick .od { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

  /* ---- Fase 1.3: AI mode badge, sources, podcast voice ---- */
  .ai-badge { display: inline-flex; align-items: center; height: 17px; padding: 0 7px; border-radius: 999px; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; }

  .ai-badge.real { background: var(--good-soft); color: var(--good); }
  h2 .ai-badge, .eyebrow + .ai-badge { margin-left: 2px; }
  .pod-cover .pc-top { position: relative; display: flex; align-items: center; gap: 8px; }
  .pod-cover .pc-top .ai-badge { background: rgba(255,255,255,.2); color: #fff; }
  .ai-sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; }
  .ai-sources .as-h { flex-basis: 100%; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }

      "pol.s09t": "Reembolsos", "pol.s09b": "Las condiciones de reembolso aplicables se muestran antes de la compra. Podrá existir una garantía comercial de satisfacción de 30 minutos para determinados planes, sujeta a las condiciones aplicables. Los derechos legales del consumidor prevalecen cuando correspondan.",
      "pol.s10t": "Pruebas y promociones", "pol.s10b": "Zynqora puede ofrecer periodos de prueba o promociones con condiciones específicas, que se comunicarán en cada caso.",
      "pol.s11t": "Privacidad y protección de datos", "pol.s11b": "Los datos personales se tratan conforme a la Política de Privacidad, que detalla finalidades, bases legales y derechos.",
      "pol.s12t": "Datos tratados", "pol.s12b": "Zynqora puede tratar datos de cuenta, datos de uso del servicio y el contenido que el usuario decida subir para utilizar las funciones de estudio.",
      "pol.s13t": "Uso de los datos", "pol.s13b": "Los datos se utilizan para prestar el servicio, mejorarlo, dar soporte y cumplir obligaciones legales. No se venden a terceros.",
      "pol.s14t": "Seguridad", "pol.s14b": "Zynqora aplica medidas técnicas y organizativas razonables para proteger la información. Ningún sistema es completamente infalible.",
      "pol.s15t": "Proveedores externos", "pol.s15b": "Zynqora se apoya en proveedores de infraestructura, inteligencia artificial y analítica necesarios para prestar el servicio, sujetos a los acuerdos de tratamiento de datos correspondientes.",
      "pol.s16t": "Derechos del usuario", "pol.s16b": "El usuario puede acceder, rectificar, eliminar y portar sus datos, así como oponerse o limitar determinados tratamientos, según la normativa aplicable, escribiendo a ZynqOraAIsolver@gmail.com.",
      "pol.s17t": "Archivos y contenido del usuario", "pol.s17b": "El usuario puede subir materiales de estudio (PDF, documentos, imágenes o texto) para utilizar las funciones de Zynqora. El usuario declara tener derecho a utilizar dichos materiales. Para prestar el servicio, los archivos podrán ser procesados por los proveedores tecnológicos necesarios cuando la arquitectura real lo requiera. Las condiciones detalladas se recogerán en la Política de Privacidad.",
      "pol.s18t": "Zynqora AI y contenido generado", "pol.s18b": "Zynqora AI ofrece apoyo educativo. Sus respuestas se generan mediante sistemas de inteligencia artificial y pueden contener errores. El usuario debe verificar la información importante. Zynqora no garantiza que una respuesta sea siempre correcta y no sustituye a profesores, profesionales u otras fuentes oficiales cuando corresponda.",
      "pol.s19t": "Uso responsable", "pol.s19b": "El usuario se compromete a no usar Zynqora para fines ilícitos, para infringir derechos de terceros ni para generar contenido dañino.",
      "pol.s20t": "Propiedad intelectual", "pol.s20b": "Zynqora y sus elementos de marca pertenecen a sus titulares. El usuario conserva los derechos sobre su propio contenido.",
      "pol.s21t": "Disponibilidad del servicio", "pol.s21b": "Zynqora se esfuerza por mantener el servicio disponible, pero pueden producirse interrupciones por mantenimiento o causas técnicas.",
      "pol.s22t": "Eliminación de cuentas", "pol.s22b": "El usuario puede eliminar su cuenta en cualquier momento. La eliminación conlleva el borrado o la anonimización de sus datos según los plazos legales.",
      "pol.s23t": "Suspensión de cuentas", "pol.s23b": "Zynqora puede suspender o restringir cuentas que incumplan estas condiciones o que pongan en riesgo el servicio o a otros usuarios.",
      "pol.s24t": "Modificación del servicio", "pol.s24b": "Zynqora puede añadir, modificar o retirar funciones para mejorar el producto, avisando de los cambios relevantes.",
      "pol.s25t": "Modificación de las políticas", "pol.s25b": "Estas condiciones pueden actualizarse. Los cambios sustanciales se comunicarán con una antelación razonable.",
      "pol.s26t": "Atención al cliente", "pol.s26b": "El usuario puede contactar con el equipo de soporte a través de los canales indicados dentro de la aplicación, o escribiendo a ZynqOraAIsolver@gmail.com.",
      "pol.s27t": "Legislación aplicable", "pol.s27b": "Estas condiciones se regirán por la legislación que resulte aplicable según el domicilio del usuario y la normativa de consumo vigente."
    },

      "pol.sub": "Everything you need to know about Zynqora, explained clearly and transparently.",
      "pol.nutshell": "In a nutshell",
      "pol.nut1t": "Cancellation", "pol.nut1d": "Subscriptions can be cancelled to avoid future renewals.",
      "pol.nut2t": "Renewal", "pol.nut2d": "Renewal terms are shown before you subscribe.",
      "pol.nut3t": "Refunds", "pol.nut3d": "Applicable terms are shown before purchase.",
      "pol.nut4t": "Privacy", "pol.nut4d": "Data is processed in line with the Privacy Policy.",
      "pol.nut5t": "AI", "pol.nut5d": "Zynqora AI is a study-support tool and its answers may contain errors.",
      "pol.adsTitle": "No ads",
      "pol.adsBody": "No ads. Just you, your studies and Zynqora. Zynqora does not use in-app advertising on any of its plans: no banners, no ads between exercises and no intrusive advertising.",
      "pol.disclaimer": "This text is a product draft. The final terms will need to be adapted to applicable law before commercial launch. Statutory consumer rights prevail where they apply.",
      "pol.s01t": "What Zynqora is for", "pol.s01b": "Zynqora is a digital study-support tool that helps you organise materials, generate review content (summaries, flashcards, tests) and plan your learning.",
      "pol.s02t": "Acceptance of the terms", "pol.s02b": "By creating an account or using Zynqora, you accept these terms. If you do not agree, you should not use the service.",
      "pol.s03t": "User account", "pol.s03b": "You are responsible for keeping your credentials confidential and for activity carried out from your account.",
      "pol.s04t": "Plans and services", "pol.s04b": "Zynqora offers a free plan and paid plans (Plus and Pro) with different usage limits. The features of each plan may evolve.",
      "pol.s05t": "Prices and payments", "pol.s05b": "Prices are shown before you subscribe, including applicable taxes where relevant. The amounts in this version are indicative.",
      "pol.s06t": "Payments and providers", "pol.s06b": "When real payments are enabled, they will be processed through external payment providers. Zynqora does not store full card details.",
      "pol.s07t": "Subscriptions and renewal", "pol.s07b": "Paid subscriptions renew for equivalent periods unless cancelled. Renewal terms are shown before you subscribe.",
      "pol.s08t": "Cancellation", "pol.s08b": "You can cancel the renewal at any time from your profile. Paid access continues until the end of the period already paid for.",
      "pol.s09t": "Refunds", "pol.s09b": "Applicable refund terms are shown before purchase. A 30-minute commercial satisfaction guarantee may exist for certain plans, subject to the applicable conditions. Statutory consumer rights prevail where they apply.",
      "pol.s10t": "Trials and promotions", "pol.s10b": "Zynqora may offer trial periods or promotions with specific conditions, communicated in each case.",
      "pol.s11t": "Privacy and data protection", "pol.s11b": "Personal data is processed in line with the Privacy Policy, which sets out purposes, legal bases and rights.",
      "pol.s12t": "Data processed", "pol.s12b": "Zynqora may process account data, service-usage data and the content you choose to upload in order to use the study features.",
      "pol.s13t": "Use of data", "pol.s13b": "Data is used to provide the service, improve it, give support and meet legal obligations. It is not sold to third parties.",
      "pol.s14t": "Security", "pol.s14b": "Zynqora applies reasonable technical and organisational measures to protect information. No system is completely infallible.",
      "pol.s15t": "Third-party providers", "pol.s15b": "Zynqora relies on infrastructure, AI and analytics providers needed to run the service, subject to the relevant data-processing agreements.",
      "pol.s16t": "User rights", "pol.s16b": "You can access, rectify, delete and port your data, and object to or restrict certain processing, in accordance with applicable law, by writing to ZynqOraAIsolver@gmail.com.",
      "pol.s17t": "User files and content", "pol.s17b": "You can upload study materials (PDF, documents, images or text) to use Zynqora's features. You declare that you have the right to use those materials. To provide the service, files may be processed by the necessary technology providers when the real architecture requires it. Detailed terms will be set out in the Privacy Policy.",
      "pol.s18t": "Zynqora AI and generated content", "pol.s18b": "Zynqora AI provides educational support. Its answers are generated by artificial-intelligence systems and may contain errors. You should verify important information. Zynqora does not guarantee that an answer is always correct and does not replace teachers, professionals or other official sources where relevant.",
      "pol.s19t": "Responsible use", "pol.s19b": "You agree not to use Zynqora for unlawful purposes, to infringe third-party rights or to generate harmful content.",
      "pol.s20t": "Intellectual property", "pol.s20b": "Zynqora and its brand elements belong to their owners. You keep the rights to your own content.",
      "pol.s21t": "Service availability", "pol.s21b": "Zynqora strives to keep the service available, but interruptions may occur due to maintenance or technical issues.",
      "pol.s22t": "Account deletion", "pol.s22b": "You can delete your account at any time. Deletion involves erasing or anonymising your data within the legal time limits.",
      "pol.s23t": "Account suspension", "pol.s23b": "Zynqora may suspend or restrict accounts that breach these terms or that put the service or other users at risk.",
      "pol.s24t": "Changes to the service", "pol.s24b": "Zynqora may add, change or remove features to improve the product, notifying users of relevant changes.",
      "pol.s25t": "Changes to the policies", "pol.s25b": "These terms may be updated. Substantial changes will be communicated with reasonable notice.",
      "pol.s26t": "Customer support", "pol.s26b": "You can contact the support team through the channels indicated within the app, or by emailing ZynqOraAIsolver@gmail.com.",
      "pol.s27t": "Governing law", "pol.s27b": "These terms are governed by the law applicable based on your place of residence and the consumer regulations in force."
