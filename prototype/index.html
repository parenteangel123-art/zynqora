      "pol.title": "Politiche e condizioni",
      "pol.sub": "Tutto quello che devi sapere su Zynqora, spiegato in modo chiaro e trasparente.",
      "pol.nutshell": "In poche parole",
      "pol.nut1t": "Cancellazione", "pol.nut1d": "Gli abbonamenti possono essere cancellati per evitare rinnovi futuri.",
      "pol.nut2t": "Rinnovo", "pol.nut2d": "Le condizioni di rinnovo vengono mostrate prima dell'abbonamento.",
      "pol.nut3t": "Rimborsi", "pol.nut3d": "Le condizioni applicabili vengono mostrate prima dell'acquisto.",
      "pol.nut4t": "Privacy", "pol.nut4d": "I dati vengono trattati in conformità con l'Informativa sulla Privacy.",
      "pol.nut5t": "IA", "pol.nut5d": "Zynqora AI è uno strumento di supporto allo studio e le sue risposte possono contenere errori.",
      "pol.adsTitle": "Senza pubblicità",
      "pol.adsBody": "Senza pubblicità. Solo tu, i tuoi studi e Zynqora. Zynqora non utilizza pubblicità all'interno dell'app in nessuno dei suoi piani: niente banner, niente pubblicità tra un esercizio e l'altro e niente annunci invasivi.",
      "pol.disclaimer": "Questo testo è una bozza di prodotto. Le condizioni definitive dovranno essere adattate alla legislazione applicabile prima del lancio commerciale. I diritti legali del consumatore prevalgono quando applicabili.",
      "pol.s01t": "Scopo di Zynqora", "pol.s01b": "Zynqora è uno strumento digitale di supporto allo studio che aiuta a organizzare i materiali, generare contenuti di ripasso (riassunti, flashcard, test) e pianificare l'apprendimento.",
      "pol.s02t": "Accettazione delle condizioni", "pol.s02b": "Creando un account o utilizzando Zynqora, l'utente accetta queste condizioni. Se non è d'accordo, non deve utilizzare il servizio.",
      "pol.s03t": "Account utente", "pol.s03b": "L'utente è responsabile di mantenere riservate le proprie credenziali e dell'attività svolta dal proprio account.",
      "pol.s04t": "Piani e servizi", "pol.s04b": "Zynqora offre un piano gratuito e piani a pagamento (Plus e Pro) con diversi limiti d'uso. Le funzioni di ciascun piano possono evolversi.",
      "pol.s05t": "Prezzi e pagamenti", "pol.s05b": "I prezzi vengono mostrati prima dell'abbonamento, comprese le imposte applicabili quando pertinenti. Gli importi di questa versione sono indicativi.",
      "pol.s06t": "Pagamenti e fornitori", "pol.s06b": "Quando saranno abilitati i pagamenti reali, verranno elaborati tramite fornitori di pagamento esterni. Zynqora non memorizza i dati completi delle carte.",
      "pol.s07t": "Abbonamenti e rinnovo", "pol.s07b": "Gli abbonamenti a pagamento si rinnovano per periodi equivalenti salvo cancellazione. Le condizioni di rinnovo vengono mostrate prima dell'abbonamento.",
      "pol.s08t": "Cancellazione", "pol.s08b": "L'utente può cancellare il rinnovo in qualsiasi momento dal proprio profilo. L'accesso a pagamento rimane attivo fino alla fine del periodo già pagato.",
      "pol.s09t": "Rimborsi", "pol.s09b": "Le condizioni di rimborso applicabili vengono mostrate prima dell'acquisto. Per alcuni piani potrà esistere una garanzia commerciale di soddisfazione di 30 minuti, soggetta alle condizioni applicabili. I diritti legali del consumatore prevalgono quando applicabili.",
      "pol.s10t": "Prove e promozioni", "pol.s10b": "Zynqora può offrire periodi di prova o promozioni con condizioni specifiche, comunicate di volta in volta.",
      "pol.s11t": "Privacy e protezione dei dati", "pol.s11b": "I dati personali vengono trattati in conformità con l'Informativa sulla Privacy, che descrive finalità, basi giuridiche e diritti.",
      "pol.s12t": "Dati trattati", "pol.s12b": "Zynqora può trattare dati dell'account, dati di utilizzo del servizio e i contenuti che l'utente decide di caricare per utilizzare le funzioni di studio.",
      "pol.s13t": "Uso dei dati", "pol.s13b": "I dati vengono utilizzati per fornire il servizio, migliorarlo, offrire assistenza e adempiere agli obblighi legali. Non vengono venduti a terzi.",
      "pol.s14t": "Sicurezza", "pol.s14b": "Zynqora applica misure tecniche e organizzative ragionevoli per proteggere le informazioni. Nessun sistema è completamente infallibile.",
      "pol.s15t": "Fornitori esterni", "pol.s15b": "Zynqora si appoggia a fornitori di infrastruttura, intelligenza artificiale e analisi necessari per fornire il servizio, soggetti ai relativi accordi sul trattamento dei dati.",
      "pol.s16t": "Diritti dell'utente", "pol.s16b": "L'utente può accedere, rettificare, eliminare e portare i propri dati, nonché opporsi o limitare determinati trattamenti, secondo la normativa applicabile, scrivendo a ZynqOraAIsolver@gmail.com.",
      "pol.s17t": "File e contenuti dell'utente", "pol.s17b": "L'utente può caricare materiali di studio (PDF, documenti, immagini o testo) per utilizzare le funzioni di Zynqora. L'utente dichiara di avere il diritto di utilizzare tali materiali. Per fornire il servizio, i file potranno essere elaborati dai fornitori tecnologici necessari quando l'architettura reale lo richieda. Le condizioni dettagliate saranno riportate nell'Informativa sulla Privacy.",
      "pol.s18t": "Zynqora AI e contenuti generati", "pol.s18b": "Zynqora AI offre supporto educativo. Le sue risposte sono generate tramite sistemi di intelligenza artificiale e possono contenere errori. L'utente deve verificare le informazioni importanti. Zynqora non garantisce che una risposta sia sempre corretta e non sostituisce insegnanti, professionisti o altre fonti ufficiali quando pertinente.",
      "pol.s19t": "Uso responsabile", "pol.s19b": "L'utente si impegna a non usare Zynqora per scopi illeciti, per violare i diritti di terzi né per generare contenuti dannosi.",
      "pol.s20t": "Proprietà intellettuale", "pol.s20b": "Zynqora e i suoi elementi di marchio appartengono ai rispettivi titolari. L'utente conserva i diritti sui propri contenuti.",
      "pol.s21t": "Disponibilità del servizio", "pol.s21b": "Zynqora si impegna a mantenere il servizio disponibile, ma possono verificarsi interruzioni per manutenzione o cause tecniche.",
      "pol.s22t": "Eliminazione degli account", "pol.s22b": "L'utente può eliminare il proprio account in qualsiasi momento. L'eliminazione comporta la cancellazione o l'anonimizzazione dei dati secondo i termini legali.",
      "pol.s23t": "Sospensione degli account", "pol.s23b": "Zynqora può sospendere o limitare account che violano queste condizioni o che mettono a rischio il servizio o altri utenti.",
      "pol.s24t": "Modifica del servizio", "pol.s24b": "Zynqora può aggiungere, modificare o rimuovere funzioni per migliorare il prodotto, comunicando i cambiamenti rilevanti.",
      "pol.s25t": "Modifica delle politiche", "pol.s25b": "Queste condizioni possono essere aggiornate. Le modifiche sostanziali saranno comunicate con un ragionevole preavviso.",
      "pol.s26t": "Assistenza clienti", "pol.s26b": "L'utente può contattare il team di assistenza tramite i canali indicati all'interno dell'app, oppure scrivendo a ZynqOraAIsolver@gmail.com.",
      "pol.s27t": "Legge applicabile", "pol.s27b": "Queste condizioni sono regolate dalla legge applicabile in base al domicilio dell'utente e dalla normativa sui consumatori in vigore."
    },

      "pol.title": "Politiques et conditions",
      "pol.sub": "Tout ce que tu dois savoir sur Zynqora, expliqué clairement et en toute transparence.",
      "pol.nutshell": "En bref",
      "pol.nut1t": "Annulation", "pol.nut1d": "Les abonnements peuvent être annulés pour éviter de futurs renouvellements.",
      "pol.nut2t": "Renouvellement", "pol.nut2d": "Les conditions de renouvellement sont affichées avant la souscription.",
      "pol.nut3t": "Remboursements", "pol.nut3d": "Les conditions applicables sont affichées avant l'achat.",
      "pol.nut4t": "Confidentialité", "pol.nut4d": "Les données sont traitées conformément à la Politique de confidentialité.",
      "pol.nut5t": "IA", "pol.nut5d": "Zynqora AI est un outil d'aide à l'étude et ses réponses peuvent contenir des erreurs.",
      "pol.adsTitle": "Sans publicité",
      "pol.adsBody": "Sans publicité. Juste toi, tes études et Zynqora. Zynqora n'utilise de publicité dans l'application sur aucun de ses forfaits : pas de bannières, pas de publicité entre les exercices et pas de publicité intrusive.",
      "pol.disclaimer": "Ce texte est une ébauche de produit. Les conditions définitives devront être adaptées à la législation applicable avant le lancement commercial. Les droits légaux des consommateurs prévalent lorsqu'ils s'appliquent.",
      "pol.s01t": "Objectif de Zynqora", "pol.s01b": "Zynqora est un outil numérique d'aide à l'étude qui aide à organiser le contenu, générer du contenu de révision (résumés, flashcards, tests) et planifier l'apprentissage.",
      "pol.s02t": "Acceptation des conditions", "pol.s02b": "En créant un compte ou en utilisant Zynqora, l'utilisateur accepte ces conditions. En cas de désaccord, il ne doit pas utiliser le service.",
      "pol.s03t": "Compte utilisateur", "pol.s03b": "L'utilisateur est responsable de la confidentialité de ses identifiants et de l'activité effectuée depuis son compte.",
      "pol.s04t": "Forfaits et services", "pol.s04b": "Zynqora propose un forfait gratuit et des forfaits payants (Plus et Pro) avec différentes limites d'utilisation. Les fonctionnalités de chaque forfait peuvent évoluer.",
      "pol.s05t": "Prix et paiements", "pol.s05b": "Les prix sont affichés avant la souscription, taxes applicables comprises le cas échéant. Les montants de cette version sont indicatifs.",
      "pol.s06t": "Paiements et prestataires", "pol.s06b": "Lorsque les paiements réels seront activés, ils seront traités par des prestataires de paiement externes. Zynqora ne stocke pas les données complètes des cartes.",
      "pol.s07t": "Abonnements et renouvellement", "pol.s07b": "Les abonnements payants se renouvellent pour des périodes équivalentes sauf annulation. Les conditions de renouvellement sont affichées avant la souscription.",
      "pol.s08t": "Annulation", "pol.s08b": "L'utilisateur peut annuler le renouvellement à tout moment depuis son profil. L'accès payant reste actif jusqu'à la fin de la période déjà payée.",
      "pol.s09t": "Remboursements", "pol.s09b": "Les conditions de remboursement applicables sont affichées avant l'achat. Une garantie commerciale de satisfaction de 30 minutes peut exister pour certains forfaits, sous réserve des conditions applicables. Les droits légaux des consommateurs prévalent lorsqu'ils s'appliquent.",
      "pol.s10t": "Essais et promotions", "pol.s10b": "Zynqora peut proposer des périodes d'essai ou des promotions avec des conditions spécifiques, communiquées au cas par cas.",
      "pol.s11t": "Confidentialité et protection des données", "pol.s11b": "Les données personnelles sont traitées conformément à la Politique de confidentialité, qui détaille les finalités, bases légales et droits.",
      "pol.s12t": "Données traitées", "pol.s12b": "Zynqora peut traiter des données de compte, des données d'utilisation du service et le contenu que l'utilisateur choisit de mettre en ligne pour utiliser les fonctionnalités d'étude.",
      "pol.s13t": "Utilisation des données", "pol.s13b": "Les données sont utilisées pour fournir le service, l'améliorer, offrir un support et respecter les obligations légales. Elles ne sont pas vendues à des tiers.",
      "pol.s14t": "Sécurité", "pol.s14b": "Zynqora applique des mesures techniques et organisationnelles raisonnables pour protéger les informations. Aucun système n'est totalement infaillible.",
      "pol.s15t": "Prestataires externes", "pol.s15b": "Zynqora s'appuie sur des prestataires d'infrastructure, d'intelligence artificielle et d'analyse nécessaires pour fournir le service, soumis aux accords de traitement des données correspondants.",
      "pol.s16t": "Droits de l'utilisateur", "pol.s16b": "L'utilisateur peut accéder à ses données, les rectifier, les supprimer et les porter, ainsi que s'opposer à certains traitements ou les limiter, conformément à la réglementation applicable, en écrivant à ZynqOraAIsolver@gmail.com.",
      "pol.s17t": "Fichiers et contenu de l'utilisateur", "pol.s17b": "L'utilisateur peut mettre en ligne du contenu d'étude (PDF, documents, images ou texte) pour utiliser les fonctionnalités de Zynqora. L'utilisateur déclare avoir le droit d'utiliser ce contenu. Pour fournir le service, les fichiers pourront être traités par les prestataires technologiques nécessaires lorsque l'architecture réelle l'exigera. Les conditions détaillées seront précisées dans la Politique de confidentialité.",
      "pol.s18t": "Zynqora AI et contenu généré", "pol.s18b": "Zynqora AI offre un soutien éducatif. Ses réponses sont générées par des systèmes d'intelligence artificielle et peuvent contenir des erreurs. L'utilisateur doit vérifier les informations importantes. Zynqora ne garantit pas qu'une réponse soit toujours correcte et ne remplace pas les enseignants, professionnels ou autres sources officielles le cas échéant.",
      "pol.s19t": "Usage responsable", "pol.s19b": "L'utilisateur s'engage à ne pas utiliser Zynqora à des fins illicites, pour porter atteinte aux droits de tiers ni pour générer du contenu nuisible.",
      "pol.s20t": "Propriété intellectuelle", "pol.s20b": "Zynqora et ses éléments de marque appartiennent à leurs titulaires. L'utilisateur conserve les droits sur son propre contenu.",
      "pol.s21t": "Disponibilité du service", "pol.s21b": "Zynqora s'efforce de maintenir le service disponible, mais des interruptions peuvent survenir pour maintenance ou raisons techniques.",
      "pol.s22t": "Suppression des comptes", "pol.s22b": "L'utilisateur peut supprimer son compte à tout moment. La suppression entraîne l'effacement ou l'anonymisation de ses données selon les délais légaux.",
      "pol.s23t": "Suspension des comptes", "pol.s23b": "Zynqora peut suspendre ou restreindre des comptes qui enfreignent ces conditions ou qui mettent en danger le service ou d'autres utilisateurs.",
      "pol.s24t": "Modification du service", "pol.s24b": "Zynqora peut ajouter, modifier ou retirer des fonctionnalités pour améliorer le produit, en informant des changements importants.",
      "pol.s25t": "Modification des politiques", "pol.s25b": "Ces conditions peuvent être mises à jour. Les changements substantiels seront communiqués avec un préavis raisonnable.",
      "pol.s26t": "Service client", "pol.s26b": "L'utilisateur peut contacter l'équipe de support via les canaux indiqués dans l'application, ou en écrivant à ZynqOraAIsolver@gmail.com.",
      "pol.s27t": "Loi applicable", "pol.s27b": "Ces conditions sont régies par la loi applicable selon le lieu de résidence de l'utilisateur et la réglementation de consommation en vigueur."
    },

      "pol.sub": "Tudo o que precisas de saber sobre a Zynqora, explicado de forma clara e transparente.",

      "pol.nut4t": "Privacidade", "pol.nut4d": "Os dados são tratados de acordo com a Política de Privacidade.",
      "pol.nut5t": "IA", "pol.nut5d": "A Zynqora AI é uma ferramenta de apoio ao estudo e as suas respostas podem conter erros.",
      "pol.adsTitle": "Sem anúncios",
      "pol.adsBody": "Sem anúncios. Só tu, os teus estudos e a Zynqora. A Zynqora não utiliza publicidade dentro da aplicação em nenhum dos seus planos: sem banners, sem publicidade entre exercícios e sem anúncios intrusivos.",
      "pol.disclaimer": "Este texto é um rascunho de produto. As condições definitivas deverão ser adaptadas à legislação aplicável antes do lançamento comercial. Os direitos legais do consumidor prevalecem quando aplicáveis.",
      "pol.s01t": "Objetivo da Zynqora", "pol.s01b": "A Zynqora é uma ferramenta digital de apoio ao estudo que ajuda a organizar materiais, gerar conteúdo de revisão (resumos, flashcards, testes) e planear a aprendizagem.",
      "pol.s02t": "Aceitação das condições", "pol.s02b": "Ao criar uma conta ou utilizar a Zynqora, o utilizador aceita estas condições. Se não concordar, não deve utilizar o serviço.",
      "pol.s03t": "Conta de utilizador", "pol.s03b": "O utilizador é responsável por manter a confidencialidade das suas credenciais e pela atividade realizada a partir da sua conta.",
      "pol.s04t": "Planos e serviços", "pol.s04b": "A Zynqora oferece um plano gratuito e planos pagos (Plus e Pro) com diferentes limites de utilização. As funcionalidades de cada plano podem evoluir.",
      "pol.s05t": "Preços e pagamentos", "pol.s05b": "Os preços são mostrados antes da subscrição, incluindo os impostos aplicáveis quando pertinente. Os valores desta versão são indicativos.",
      "pol.s06t": "Pagamentos e fornecedores", "pol.s06b": "Quando os pagamentos reais forem ativados, serão processados através de fornecedores de pagamento externos. A Zynqora não armazena dados completos de cartões.",
      "pol.s07t": "Subscrições e renovação", "pol.s07b": "As subscrições pagas renovam-se por períodos equivalentes, salvo cancelamento. As condições de renovação são mostradas antes da subscrição.",
      "pol.s08t": "Cancelamento", "pol.s08b": "O utilizador pode cancelar a renovação a qualquer momento a partir do seu perfil. O acesso pago mantém-se até ao final do período já pago.",
      "pol.s09t": "Reembolsos", "pol.s09b": "As condições de reembolso aplicáveis são mostradas antes da compra. Poderá existir uma garantia comercial de satisfação de 30 minutos para determinados planos, sujeita às condições aplicáveis. Os direitos legais do consumidor prevalecem quando aplicáveis.",
      "pol.s10t": "Testes e promoções", "pol.s10b": "A Zynqora pode oferecer períodos de teste ou promoções com condições específicas, comunicadas em cada caso.",
      "pol.s11t": "Privacidade e proteção de dados", "pol.s11b": "Os dados pessoais são tratados de acordo com a Política de Privacidade, que detalha finalidades, bases legais e direitos.",
      "pol.s12t": "Dados tratados", "pol.s12b": "A Zynqora pode tratar dados da conta, dados de utilização do serviço e o conteúdo que o utilizador decida carregar para utilizar as funcionalidades de estudo.",
      "pol.s13t": "Uso dos dados", "pol.s13b": "Os dados são utilizados para prestar o serviço, melhorá-lo, dar apoio e cumprir obrigações legais. Não são vendidos a terceiros.",
      "pol.s14t": "Segurança", "pol.s14b": "A Zynqora aplica medidas técnicas e organizativas razoáveis para proteger a informação. Nenhum sistema é completamente infalível.",
      "pol.s15t": "Fornecedores externos", "pol.s15b": "A Zynqora apoia-se em fornecedores de infraestrutura, inteligência artificial e análise necessários para prestar o serviço, sujeitos aos respetivos acordos de tratamento de dados.",
      "pol.s16t": "Direitos do utilizador", "pol.s16b": "O utilizador pode aceder, retificar, eliminar e portar os seus dados, bem como opor-se ou limitar determinados tratamentos, de acordo com a legislação aplicável, escrevendo para ZynqOraAIsolver@gmail.com.",
      "pol.s17t": "Ficheiros e conteúdo do utilizador", "pol.s17b": "O utilizador pode carregar materiais de estudo (PDF, documentos, imagens ou texto) para utilizar as funcionalidades da Zynqora. O utilizador declara ter o direito de utilizar esses materiais. Para prestar o serviço, os ficheiros poderão ser processados pelos fornecedores tecnológicos necessários quando a arquitetura real o exigir. As condições detalhadas constarão da Política de Privacidade.",
      "pol.s18t": "Zynqora AI e conteúdo gerado", "pol.s18b": "A Zynqora AI oferece apoio educativo. As suas respostas são geradas por sistemas de inteligência artificial e podem conter erros. O utilizador deve verificar informações importantes. A Zynqora não garante que uma resposta esteja sempre correta e não substitui professores, profissionais ou outras fontes oficiais quando pertinente.",
      "pol.s19t": "Uso responsável", "pol.s19b": "O utilizador compromete-se a não usar a Zynqora para fins ilícitos, para infringir direitos de terceiros nem para gerar conteúdo prejudicial.",
      "pol.s20t": "Propriedade intelectual", "pol.s20b": "A Zynqora e os seus elementos de marca pertencem aos respetivos titulares. O utilizador mantém os direitos sobre o seu próprio conteúdo.",
      "pol.s21t": "Disponibilidade do serviço", "pol.s21b": "A Zynqora esforça-se por manter o serviço disponível, mas podem ocorrer interrupções por manutenção ou causas técnicas.",
      "pol.s22t": "Eliminação de contas", "pol.s22b": "O utilizador pode eliminar a sua conta a qualquer momento. A eliminação implica o apagamento ou a anonimização dos seus dados de acordo com os prazos legais.",
      "pol.s23t": "Suspensão de contas", "pol.s23b": "A Zynqora pode suspender ou restringir contas que violem estas condições ou que coloquem em risco o serviço ou outros utilizadores.",
      "pol.s24t": "Modificação do serviço", "pol.s24b": "A Zynqora pode adicionar, modificar ou remover funcionalidades para melhorar o produto, avisando sobre alterações relevantes.",
      "pol.s25t": "Modificação das políticas", "pol.s25b": "Estas condições podem ser atualizadas. As alterações substanciais serão comunicadas com uma antecedência razoável.",
      "pol.s26t": "Apoio ao cliente", "pol.s26b": "O utilizador pode contactar a equipa de apoio através dos canais indicados dentro da aplicação, ou escrevendo para ZynqOraAIsolver@gmail.com.",
      "pol.s27t": "Legislação aplicável", "pol.s27b": "Estas condições regem-se pela legislação aplicável de acordo com a residência do utilizador e a regulamentação de consumo em vigor."
    }

        var etier = /dif[ií]cil|avanzad|hard|challenging/.test((text || "").toLowerCase()) ? "hard"
          : /f[aá]cil|sencill|b[aá]sic|easy/.test((text || "").toLowerCase()) ? "easy" : "med";
        var xb = exBank(sid);
        if (xb) {
          var xn = 1, xm = (text || "").match(/(\d+)\s*(ejercicio|problema|exercise|problem)/i);
          if (xm) xn = Math.max(1, Math.min(5, parseInt(xm[1], 10)));
          var xs = (xb[etier] || xb.med).slice(0, xn).map(function (x) { return x.q; });
          var lead = DB.lang === "en" ? (xn > 1 ? "Here are " + xn + " exercises" : "Here's an exercise") : (xn > 1 ? "Aquí tienes " + xn + " ejercicios" : "Aquí tienes un ejercicio");
          var foot = DB.lang === "en" ? "Send me your answers and I'll check them." : "Mándame tus respuestas y las corrijo.";
          return { html: "<p>" + lead + " 👇</p><ol>" + xs.map(function (x) { return "<li>" + x + "</li>"; }).join("") + '</ol><p class="ai-followup">' + foot + "</p>", tutor: true };
        }
        return { html: this._sub(gb.help_exercise, s), tutor: false };
      }
      // "ponme una flashcard"
      if (intent === "flashcard") {
        if (s && s.flashcards && s.flashcards.length) {
          var rf = s.flashcards[Math.floor(Math.random() * s.flashcards.length)];
          var foot2 = DB.lang === "en" ? "Cover the answer and test yourself." : "Tapa la respuesta y ponte a prueba.";
          return { html: '<p>Flashcard 👇</p><div class="ai-fc"><div class="ai-fc-q">' + L(rf.q) + '</div><div class="ai-fc-a">' + L(rf.a) + '</div></div><p class="ai-followup">' + foot2 + "</p>", tutor: true };
        }
        return { html: this._sub(gb.default_free, s), tutor: false };
      }

      // direct topical answers (números naturales, derivadas, revolución francesa…)
      var tm = (["explain", "simple", "detailed", "default", "summarize"].indexOf(intent) > -1) ? this.topicMatch(text) : null;
      if (tm) return { html: tm.html, quiz: tm.quiz || null, tutor: true };

      // subject bank (context or detected)
      if (s) {
        var sbank = (s.ai && s.ai[DB.lang]) || {};
        var ebank = (EXTRA_AI[s.id] && EXTRA_AI[s.id][DB.lang]) || {};
        var key = intent === "detailed" ? "explain" : intent;
        var out = sbank[key] || ebank[key];
        if (out) {
          out = this._sub(out, s).replace(/<p class="ai-followup">[\s\S]*?<\/p>\s*$/, "");
          if (intent === "detailed") out += (DB.lang === "en" ? "<p>That's the core idea. I can add the exam angle or a worked example.</p>" : "<p>Esa es la idea central. Puedo añadir el enfoque de examen o un ejemplo resuelto.</p>");
          return { html: out, tutor: TUTOR.indexOf(intent) > -1 };
        }
        if (intent === "example" || intent === "compare") {

          return { html: this._sub(gb.direct_generic, s, L(s.doc.analysis.main)[0] || L(s.name)), tutor: true };
        }
      }

      // generic — still answers
      var term = this.extractTerm(text);
      var g;

      else g = s ? gb.default_ctx : gb.default_free;
      if (Array.isArray(g)) g = this._pick(g);
      return { html: this._sub(g, s, term), tutor: TUTOR.indexOf(intent) > -1 };
    },

      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'")
      .replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();

  function mmTranslateText(text, src, tgt) {

    return fetch(url).then(function (res) { return res.json(); }).then(function (data) {

  /* ---- REAL provider: Zynqora AI real, vía Edge Function de Supabase (o proxy).
         La GEMINI_API_KEY vive SOLO en el backend. El frontend nunca la ve. ---- */
  var RealGeminiProvider = {
    id: "gemini",
    _call: function (task, body) {
      var url = aiEndpointUrl();
      if (!url) return Promise.reject({ noEndpoint: true });
      // El access_token de Supabase dura ~1h. Si ha caducado (401), intentamos
      // refrescarlo con el refresh_token (que dura mucho más) UNA vez y
      // reintentamos la llamada antes de rendirnos — así el usuario no tiene
      // que volver a iniciar sesión a mano cada hora.
      function attempt(isRetry) {
        var headers = { "content-type": "application/json" };
        var bearer = AI_CONFIG.authToken || AI_CONFIG.supabaseAnonKey;
        if (bearer) headers["authorization"] = "Bearer " + bearer;
        if (AI_CONFIG.supabaseAnonKey) headers["apikey"] = AI_CONFIG.supabaseAnonKey;
        return fetch(url, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(Object.assign({ task: task, lang: DB.lang }, body || {}))
        }).then(function (res) {
          if (res.status === 401 && !isRetry && typeof Auth !== "undefined" && Auth.enabled() && Auth.session() && Auth.session().refresh_token) {
            return Auth.refresh().then(function () { return attempt(true); }, function () { return finish(res); });
          }
          return finish(res);
        });
      }
      function finish(res) {
        return res.text().then(function (tx) {
          var data; try { data = tx ? JSON.parse(tx) : {}; } catch (e) { data = { detail: tx }; }
          if (res.status === 402 && data && data.code === "LIMIT_REACHED") throw { limitReached: true, quota: data.quota };
          if (!res.ok) throw { status: res.status, detail: (data && data.detail) || tx };
          return data;
        });
      }
      return attempt(false);
    },
    generateSummary: function (o) { return this._call("generate_summary", { documentId: o.docId, subjectId: o.subjectId }); },
    generateFlashcards: function (o) { return this._call("generate_flashcards", { documentId: o.docId, subjectId: o.subjectId, count: o.count || 8, difficulty: o.difficulty || "med" }); },
    generateQuiz: function (o) { return this._call("generate_quiz", { documentId: o.docId, subjectId: o.subjectId, count: o.count || 5, difficulty: o.difficulty || "med" }); },
    generateExercises: function (o) { return this._call("generate_exercises", { documentId: o.docId, subjectId: o.subjectId, count: o.count || 3, difficulty: o.difficulty || "med" }); },
    chat: function (o) {
      return this._call("chat", {
        text: o.text, intent: o.intent || null,
        history: (o.history || []).map(function (m) {
          var txt = m.htmlKey ? ZAI.resolveKey(m.htmlKey) : (m.html || L(m.text || ""));
          return { role: m.role === "ai" ? "model" : "user", text: String(txt).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim() };
        }),
        context: (o.contextId || o.docId) ? materialFor(o.contextId, o.docId) : null,
        docId: o.docId || null,
        profile: o.profile || aiProfile(),
        allowSearch: AI_CONFIG.webSearch && o.allowSearch !== false,
        model: /prep_exam|detailed|plan|why_failed|exercise|compare/.test(o.intent || "") ? AI_CONFIG.models.reasoning : AI_CONFIG.models.chat
      });
    },
    podcastScript: function (o) {
      return this._call("generate_podcast_script", {
        subjectId: o.subjectId, documentId: o.docId || null,
        approach: o.approach, minutes: o.minutes, voiceStyle: o.voiceStyle
      }).then(function (r) { return r.result || r; });
    },
    tts: function (o) {
      return this._call("podcast_tts", {
        segments: (o.segments || []).map(function (s) { return { speaker: s.speaker, text: s.speech || s.text }; }),  // texto ya normalizado para voz
        direction: o.direction || "",              // dirección de interpretación (tono, pausas, énfasis)

  /* =====================================================================
     FASE F — Auth + Sync con Supabase.
     AMBOS MÓDULOS ESTÁN DORMIDOS mientras no haya `AI_CONFIG.supabaseUrl`.
     En el artifact (sin backend) nunca se ejecutan: la app sigue 100% local.
     Contrato REST de Supabase Auth y PostgREST — sin dependencias externas.
     ===================================================================== */
  var Auth = (function () {
    function base() { return (AI_CONFIG.supabaseUrl || "").replace(/\/+$/, ""); }
    function enabled() { return !!(AI_CONFIG.supabaseUrl && AI_CONFIG.supabaseAnonKey); }
    function _post(path, body) {
      return fetch(base() + "/auth/v1/" + path, {
        method: "POST",
        headers: { "content-type": "application/json", "apikey": AI_CONFIG.supabaseAnonKey },
        body: JSON.stringify(body || {})
      }).then(function (r) { return r.text().then(function (tx) { var j; try { j = tx ? JSON.parse(tx) : {}; } catch (e) { j = {}; } if (!r.ok) throw j; return j; }); });
    }
    function session() {
      try { var s = JSON.parse(lsGet("zynqora.session", "null")); return (s && s.access_token) ? s : null; } catch (e) { return null; }
    }
    function setSession(j) {
      if (!j || !j.access_token) return null;
      var s = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user, expires_in: j.expires_in, at: Date.now() };
      lsSet("zynqora.session", JSON.stringify(s));
      AI_CONFIG.authToken = j.access_token; lsSet("zynqora.authToken", j.access_token);
      if (j.user) {
        var isNewAccount = !DB.profile || DB.profile.id !== j.user.id;
        if (isNewAccount) { try { clearLocalForNewAccount(); } catch (e) {} }
        DB.profile = DB.profile || {};
        DB.profile.id = j.user.id;
        if (j.user.email) DB.profile.email = j.user.email;
        syncUser(); persist("profile");
      }
      refreshAIProvider();
      return s;
    }
    // Confirmación de email por enlace: Supabase redirige a Site URL con
    // #access_token=...&refresh_token=...&type=signup (o error=...&error_description=...).
    // Esto NO llega como típico "código de 6 dígitos" (eso exigiría SMTP propio) —
    // el usuario simplemente toca el enlace del correo y, al volver a la app, queda
    // verificado y con sesión iniciada automáticamente.
    function parseHash() {
      var h = (window.location.hash || "").replace(/^#/, "");
      if (!h || (h.indexOf("access_token") === -1 && h.indexOf("error") === -1)) return null;
      var p = {};
      h.split("&").forEach(function (kv) {
        var i = kv.indexOf("="); if (i < 0) return;
        try { p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " ")); } catch (e) {}
      });
      return (p.access_token || p.error) ? p : null;
    }
    function fetchUser(token) {
      return fetch(base() + "/auth/v1/user", { headers: { apikey: AI_CONFIG.supabaseAnonKey, authorization: "Bearer " + token } })
        .then(function (r) { return r.json(); });
    }
    return {
      enabled: enabled,
      session: session,
      user: function () { var s = session(); return s ? s.user : null; },
      signUp: function (email, password, name) {
        return _post("signup", { email: email, password: password, data: { name: name || "" } }).then(function (j) { if (j.access_token) setSession(j); return j; });
      },
      signIn: function (email, password) {
        return _post("token?grant_type=password", { email: email, password: password }).then(setSession);
      },
      recover: function (email) { return _post("recover", { email: email }); },
      // Botón "Continuar con Google": manda el navegador a Supabase, que a su vez
      // manda a Google. Al volver, Supabase redirige aquí mismo con
      // #access_token=... en la URL — lo recoge consumeRedirect() al arrancar,
      // igual que con el enlace de verificación de email.
      // prompt=select_account: sin esto, si el navegador ya tiene una sesión de
      // Google abierta, Google la reutiliza en silencio y siempre entra con la
      // misma cuenta aunque quieras probar con otra — con esto, Google SIEMPRE
      // enseña el selector de cuentas para elegir cuál usar.
      signInWithGoogle: function () {
        var redirectTo = window.location.origin + window.location.pathname;
        window.location.href = base() + "/auth/v1/authorize?provider=google&prompt=select_account&redirect_to=" + encodeURIComponent(redirectTo);
      },
      refresh: function () {
        var s = session(); if (!s || !s.refresh_token) return Promise.reject({ noSession: true });
        return _post("token?grant_type=refresh_token", { refresh_token: s.refresh_token }).then(setSession);
      },
      // Se llama una vez al arrancar: si venimos de tocar el enlace de verificación
      // del correo, completa el login y limpia el hash de la URL. Devuelve
      // {ok:true} si había sesión nueva, {ok:false,error} si el enlace falló
      // (caducado/ya usado), o null si no había nada que consumir.
      consumeRedirect: function () {
        var p = parseHash();
        if (!p) return Promise.resolve(null);
        try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
        if (p.error) return Promise.resolve({ ok: false, error: p.error_description || p.error });
        return fetchUser(p.access_token).then(function (u) {
          setSession({ access_token: p.access_token, refresh_token: p.refresh_token, expires_in: p.expires_in, user: u });
          return { ok: true, type: p.type || "signup" };
        }).catch(function () { return { ok: false, error: "network" }; });
      },
      signOut: function () {
        var s = session();
        lsSet("zynqora.session", ""); AI_CONFIG.authToken = ""; lsSet("zynqora.authToken", "");
        refreshAIProvider();
        if (s) { try { fetch(base() + "/auth/v1/logout", { method: "POST", headers: { apikey: AI_CONFIG.supabaseAnonKey, authorization: "Bearer " + s.access_token } }).catch(function () {}); } catch (e) {} }
      },
      deleteAccount: function () {
        // RPC delete_my_account() — borra el usuario en Supabase (cascada). Ver 0004_functions.sql.
        return Sync._rpc("delete_my_account", {});
      }
    };
  })();

  /* Sincronización local (IndexedDB) ↔ Supabase (PostgREST).
     - Supabase manda cuando hay sesión; IndexedDB = caché/offline.
     - upsert por UUID -> sin duplicados aunque el push se repita.
     - conflicto: last-write-wins por updated_at.
     NOTA: los `id` locales del prototipo son "idXXXX" (no UUID). Al activar el
     cloud hay que migrarlos a crypto.randomUUID() — marcado con TODO abajo. */
  var Sync = (function () {
    function base() { return (AI_CONFIG.supabaseUrl || "").replace(/\/+$/, ""); }
    function on() { return Auth.enabled() && !!Auth.session(); }
    function headers(extra) {
      var s = Auth.session();
      return Object.assign({
        "content-type": "application/json",
        "apikey": AI_CONFIG.supabaseAnonKey,
        "authorization": "Bearer " + ((s && s.access_token) || AI_CONFIG.supabaseAnonKey)
      }, extra || {});
    }
    function rest(path, opts) {
      return fetch(base() + "/rest/v1/" + path, Object.assign({ headers: headers(opts && opts.headers) }, opts))
        .then(function (r) { return r.text().then(function (tx) { var j; try { j = tx ? JSON.parse(tx) : null; } catch (e) { j = null; } if (!r.ok) throw { status: r.status, body: j || tx }; return j; }); });
    }
    function _rpc(fn, args) {
      if (!Auth.enabled()) return Promise.reject({ noCloud: true });
      return rest("rpc/" + fn, { method: "POST", body: JSON.stringify(args || {}) });
    }
    // mapea DB.* -> filas de tabla. Devuelve null si la entidad no se sincroniza aún.
    function rowsFor(entity, uid) {
      if (entity === "subjects") return DB.subjects.map(function (s) { return { id: s.id, user_id: uid, name: L(s.name), icon: s.icon, color: s.color, mastery: s.mastery || 0 }; });
      if (entity === "calendar") return DB.calendar.map(function (t) { return { id: t.id, user_id: uid, subject_id: t.subjectId || null, title: L(t.title), description: t.desc || null, type: t.type || "study", due_date: t.date, due_time: t.time || null, done: !!t.done }; });
      if (entity === "documents") return (DB.documents || []).filter(function (d) { return !d.seeded; }).map(function (d) { return { id: d.id, user_id: uid, subject_id: d.subjectId || null, name: L(d.title), kind: d.kind, mime_type: d.mime || null, size: d.sizeBytes || 0, storage_path: d.storagePath || null, status: d.status === "analyzed" ? "ready" : d.status, text_source: d.textSource || null, extracted_text: d.text || null, summary: d.summary || null, metadata: d.analysis || {} }; });
      if (entity === "conversations") return DB.conversations.filter(function (c) { return c.messages && c.messages.length; }).map(function (c) { return { id: c.id, user_id: uid, subject_id: c.contextId || null, document_id: c.docId || null, title: c.title ? L(c.title) : null, thread: { messages: c.messages || [] } }; });
      if (entity === "sessions") return DB.sessions.map(function (x) { return { id: x.id, user_id: uid, subject_id: x.subjectId || null, document_id: x.docId || null, mode: x.mode || "review", score: x.score, total: x.total || null }; });
      return null;
    }
    var ENTITIES = { subjects: "subjects", calendar: "calendar_tasks", documents: "documents", conversations: "conversations", sessions: "study_sessions" };
    return {
      _rpc: _rpc,
      enabled: on,
      push: function (entity) {
        if (!on()) return Promise.resolve();
        var uid = Auth.user() && Auth.user().id;
        if (!uid) return Promise.resolve();
        if (entity === "profile" || entity === "state") {
          // La fila de profiles ya existe (la crea un trigger en Supabase al registrarse) -> PATCH, no upsert.
          var body = {
            name: (DB.profile && DB.profile.name) || null,
            avatar_url: DB.avatar || null,
            language: DB.lang || "es",
            theme: DB.theme || "system",
            accent: DB.accent || "violet",
            plan_key: DB.plan || "free",
            onboarding: { done: !!DB.onboardingDone },

  // (Antes aquí se exponía window.ZynqoraCloud con el AI_CONFIG editable y los

  // Convierte lo que devuelve Sync.pull() (filas de Postgres) de vuelta a la
  // forma que usa DB.* en el front. Es el espejo de rowsFor() en Sync.
  function hydrateFromCloud(r) {
    if (!r) return false;
    var gotAny = false;
    if (r.profile) {
      DB.profile = DB.profile || {};
      if (r.profile.name) DB.profile.name = r.profile.name;
      if (r.profile.email) DB.profile.email = r.profile.email;
      if (r.profile.avatar_url) DB.avatar = r.profile.avatar_url;
      if (r.profile.plan_key) DB.plan = r.profile.plan_key;
      if (r.profile.language) DB.lang = r.profile.language;
      if (r.profile.theme) DB.theme = r.profile.theme;
      if (r.profile.accent) DB.accent = r.profile.accent;
      if (r.profile.onboarding && typeof r.profile.onboarding.done === "boolean") DB.onboardingDone = r.profile.onboarding.done;
      if (r.profile.prefs) {
        var pr = r.profile.prefs;
        if (pr.goalMin != null) DB.goalMin = pr.goalMin;
        if (pr.sessionLength) DB.sessionLength = pr.sessionLength;
        if (typeof pr.notifications === "boolean") DB.notifications = pr.notifications;
        if (pr.reminder) DB.reminder = pr.reminder;
      }
      gotAny = true;
    }
    if (Array.isArray(r.subjects) && r.subjects.length) {
      // La tabla subjects de Supabase solo guarda id/nombre/icono/color/mastery —
      // el resto (doc de referencia, temas flojos, etc.) vive únicamente en local.
      // Por eso NO se reemplaza sin más: se actualizan esos campos sobre la
      // materia local si ya existía (conserva su contenido), y si es una
      // materia que llega por primera vez (otro dispositivo) se le da la
      // misma base que usa "crear materia" para que no falte nada.
      var existingById = {};
      DB.subjects.forEach(function (s) { existingById[s.id] = s; });
      DB.subjects = r.subjects.map(function (row) {
        var ex = existingById[row.id];
        // Una materia que llega por primera vez (p.ej. desde otro dispositivo)
        // nunca se rellena con el contenido de otra materia de ejemplo — se le
        // da la misma base vacía que usa "crear materia".
        var base = ex ? clone(ex) : {
          weak: { es: [], en: [] }, flashcards: [], quiz: [], ai: { es: {}, en: {} },
          doc: emptySubjectDoc(row.name), extraDocs: []
        };
        base.id = row.id;
        base.name = { es: row.name, en: row.name };
        base.icon = row.icon || base.icon || "book";
        base.color = row.color || base.color || "#5A54C9";
        base.mastery = (row.mastery != null) ? row.mastery : (base.mastery || 0);
        if (!ex) {
          base.testsTaken = 0; base.lastSessionDays = 0; base.extraDocs = base.extraDocs || [];
          base.doc = emptySubjectDoc(row.name);
        }
        return base;
      });
      if (!DB.currentSubjectId || !subj(DB.currentSubjectId)) DB.currentSubjectId = DB.subjects[0].id;
      gotAny = true;
    }
    if (Array.isArray(r.calendar)) {
      DB.calendar = r.calendar.map(function (x) { return { id: x.id, title: { es: x.title, en: x.title }, subjectId: x.subject_id, type: x.type || "study", date: x.due_date, time: x.due_time || "", desc: x.description || "", done: !!x.done }; });
      if (r.calendar.length) gotAny = true;
    }
    if (Array.isArray(r.documents)) {
      DB.documents = r.documents.map(function (d) { return { id: d.id, title: { es: d.name, en: d.name }, subjectId: d.subject_id, kind: d.kind, mime: d.mime_type, sizeBytes: d.size, storagePath: d.storage_path, status: d.status === "ready" ? "analyzed" : d.status, textSource: d.text_source, text: d.extracted_text, summary: d.summary, analysis: d.metadata || {} }; });
      if (r.documents.length) gotAny = true;
    }
    if (Array.isArray(r.conversations)) {
      DB.conversations = r.conversations.map(function (c) { return { id: c.id, contextId: c.subject_id, docId: c.document_id, title: c.title ? { es: c.title, en: c.title } : null, updated: c.updated_at ? Date.parse(c.updated_at) : Date.now(), messages: (c.thread && c.thread.messages) || [] }; });
      if (r.conversations.length) gotAny = true;
    }
    if (Array.isArray(r.sessions)) {
      DB.sessions = r.sessions.map(function (x) { return { id: x.id, subjectId: x.subject_id, docId: x.document_id, mode: x.mode, score: x.score, total: x.total }; });
    }
    if (r.usage) DB.usage = Object.assign({}, DB.usage, r.usage);
    if (!DB.subjects.length) DB.onboardingDone = false;
    // Solo guardamos en caché local (IndexedDB) lo que acabamos de traer de la
    // nube — nunca lo volvemos a mandar a Supabase (sería un eco inútil de lo
    // mismo que ya tiene).
    var wasBooting = BOOTING; BOOTING = true;
    persistAll();

  }
  // Tras iniciar sesión (o al arrancar con sesión ya guardada): trae lo que haya
  // en Supabase y lo vuelca en DB.*. Si la cuenta está recién creada (sin datos
  // aún en la nube), no hace nada — el usuario simplemente empieza vacío.
  function cloudPullAndHydrate() {
    if (!Sync.enabled()) return Promise.resolve(false);
    return Sync.pull().then(hydrateFromCloud).catch(function () { return false; });
  }
  // Justo después de iniciar sesión (registro confirmado o login): trae los
  // datos reales de la cuenta y decide si toca onboarding (cuenta nueva, sin
  // materias todavía) o directo al dashboard (cuenta con datos ya guardados).
  function onSignedIn() {
    toast(DB.lang === "en" ? "Signed in" : "Sesión iniciada");
    cloudPullAndHydrate().then(function () {
      S.authPendingEmail = null;
      S.screen = (DB.subjects && DB.subjects.length) ? "dashboard" : "onboarding";
      render();
    });
  }

  /* ================= RENDER / NAV / EVENTS ================= */
  function render(soft) {
    // Cuenta obligatoria: sin sesión válida, no se enseña ninguna otra pantalla
    // (ni la landing ni datos locales) — todo camino lleva a "auth".
    if (Auth.enabled() && !Auth.session() && S.screen !== "auth") { S.screen = "auth"; if (!S.authMode) S.authMode = "signup"; }
    var fn = V[S.screen] || V.landing;
    if (["document", "notes", "study", "analysis", "addMaterial", "subject", "calendar", "plan"].indexOf(S.screen) < 0 && S.screen.indexOf("st-") !== 0) S.variant = null;
    var aiConv = S.screen === "ai" && !S.convListView && (S.convId || AI_CTX);
    scroll.classList.toggle("lockscroll", !!aiConv);
    var html;
    try {
      html = fn();
    } catch (e) {
      // Cualquier pantalla puede fallar por datos inesperados (p. ej. justo
      // después de sincronizar con la nube) — mejor mostrar el estado de
      // error ya existente que dejar la pantalla congelada o en blanco.
      try { console.error("Zynqora render error on screen '" + S.screen + "':", e); } catch (e2) {}
      if (S.screen !== "st-error") { S.screen = "st-error"; return render(soft); }
      html = "";
    }
    scroll.innerHTML = '<div class="view' + (soft ? "" : " view-enter") + '">' + html + "</div>" + sheetHtml();
    if (!aiConv) scroll.scrollTop = 0;
    afterRender();
  }
  function afterRender() {
    var cs = document.getElementById("chatScroll");
    if (cs) cs.scrollTop = cs.scrollHeight;
    var ta = document.getElementById("aiInput");
    if (ta) {
      ta.addEventListener("input", function () { ta.style.height = "auto"; ta.style.height = Math.min(96, ta.scrollHeight) + "px"; });
      ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); aiSend(); } });
    }
    var fi = document.getElementById("fileInput");
    if (fi) fi.addEventListener("change", function () {
      if (fi.files && fi.files[0]) { pickFile(fi.files[0]); }
    });
    var dz = document.getElementById("dropzone");
    if (dz) {
      dz.addEventListener("dragover", function (e) { e.preventDefault(); dz.classList.add("hot"); });
      dz.addEventListener("dragleave", function () { dz.classList.remove("hot"); });
      dz.addEventListener("drop", function (e) {
        e.preventDefault(); dz.classList.remove("hot");
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]);
      });
    }
    var afi = document.getElementById("aiFileInput");
    if (afi) afi.addEventListener("change", function () {
      var f = afi.files && afi.files[0];
      if (!f) return;
      var ty = /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|heic)$/i.test(f.name) ? "image"
        : /pdf/.test(f.type) || /\.pdf$/i.test(f.name) ? "pdf" : "doc";
      AI_ATTACH = { name: f.name, type: ty, file: f };
      S.attachMenu = 0; render(true);
      setTimeout(function () { var ti = document.getElementById("aiInput"); if (ti) ti.focus(); }, 30);
    });
    var pfi = document.getElementById("photoInput");
    if (pfi) pfi.addEventListener("change", function () {
      var f = pfi.files && pfi.files[0]; if (!f) return;
      var keepOpen = S.sheet && S.sheet.kind === "photo";
      if (keepOpen) keepProfileSheet();
      try {
        var rd = new FileReader();
        rd.onload = function () { setAvatar(String(rd.result)); if (!keepOpen) S.sheet = null; render(keepOpen); toast(t("profile.photoSaved")); };
        rd.readAsDataURL(f);
      } catch (e) { setAvatar(AVATAR_PRESETS[1]); if (!keepOpen) S.sheet = null; render(keepOpen); }
    });
    var fib = document.getElementById("fibInput");
    if (fib) {
      fib.focus();
      fib.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); var b = document.querySelector('[data-action="fib-check"],[data-action="fib-next"]'); if (b) b.click(); } });
    }

      addedAt: Date.now(), status: "processing",
      textSource: isPaste ? "paste" : null, text: isPaste ? pasted : null, image: null, note: null,
      analysis: null, summary: null, flashcards: null, quiz: null, sessions: [], seeded: false, pages: 0
    };
    DB.documents.push(rec);
    S.docId = rec.id;
    persist("documents");

    S._ingestPromise = isPaste ? Promise.resolve() : Ingest.ingest(S.addFile).then(function (r) {
      rec.kind = r.kind || "file"; rec.mime = r.mime || rec.mime;
      if (r.sizeBytes) rec.sizeBytes = r.sizeBytes;
      rec.text = r.text || null; rec.textSource = r.textSource || null;
      rec.image = r.image || null; rec.note = r.note || null;
      rec.status = r.status || "failed";
    }).catch(function () { rec.status = "failed"; rec.note = "unsupported"; });

    S.addFile = null; S.addPick = null;
    S.analysisStep = 0; S.analysisRunning = 0;
    S.screen = "analysis"; render();
  }
  function addPlanToCalendar() {
    var s = cur();
    var labels = [
      { es: L(s.name) + " · resumen + flashcards", en: L(s.name) + " · summary + flashcards" },
      { es: "Repaso de " + (L(s.weak)[0] || ""), en: "Review of " + (L(s.weak)[0] || "") },
      { es: "Flashcards de " + L(s.name), en: L(s.name) + " flashcards" },
      { es: "Test de práctica", en: "Practice test" },
      { es: "Repaso ligero", en: "Light review" }
    ];
    for (var i = 0; i < 5; i++) DB.calendar.push({ id: uid(), title: labels[i], subjectId: s.id, type: i === 3 ? "exercise" : i === 2 ? "review" : "study", date: isoDate(addDays(i + 1)), time: "", done: false });
    persist("calendar");
    toast(t("plan.added")); go2("calendar");
  }

  function gotoScreen(id) {
    if (id === "st-first") { S.dashFirst = 1; S.screen = "dashboard"; return render(); }
    if (id.indexOf("st-") === 0) { if (id === "st-empty-notes") S.variant = "empty"; if (id === "st-allclear") S.variant = "allclear"; S.screen = id; return render(); }
    if (id === "analysis") { S.analysisStep = 4; S.analysisRunning = 0; S.screen = "analysis"; return render(); }
    if (id === "ai") { S.convListView = 1; S.convId = null; AI_CTX = null; AI_ATTACH = null; S.attachMenu = 0; S.ctxPop = 0; S.screen = "ai"; return render(); }
    go(id);
  }

  /* ---- keyboard: presentation navigation ---- */
  document.addEventListener("keydown", function (e) {
    if (S.screen !== "toolFlow" || (S.toolStep || 0) !== 3 || S.tool !== "presentation") return;
    if (/^(INPUT|TEXTAREA)$/.test((e.target && e.target.tagName) || "")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault(); S.slideIdx = Math.min(deckLen() - 1, (S.slideIdx || 0) + 1); render(true);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); S.slideIdx = Math.max(0, (S.slideIdx || 0) - 1); render(true);
    } else if (e.key === "Escape" && S.presMode) {
      S.presMode = 0; render(true);
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (err) {}
    } else if ((e.key === "f" || e.key === "F") && !S.presMode) {
      S.presMode = 1; render(true);
    }
  });

  /* ---- init ---- */
  try { window.ZynqoraSpeech = { normalize: normalizeScriptForSpeech, direction: addVoiceDirection }; } catch (e) {}
  speechInit();
  S.calMonth = new Date();
  S.obGoals = [];
  syncUser();
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { applyAccent(); render(true); }); } catch (e) {}
  setTheme(DB.theme);
  setLang(DB.lang);
  setAccent(DB.accent);
  applyStatic();

  scroll.innerHTML = '<div class="view"><div class="app-splash"><span class="mk">' + icon("logo", 26) + "</span></div></div>";
  Store.open()
    .then(function () { return Store.available() ? Store.loadAll() : null; })
    .then(function (data) {
      var hasData = data && (data.state || (Array.isArray(data.subjects) && data.subjects.length));
      if (hasData) hydrate(data);
      else if (Store.available()) persistAll();          // primera vez: sembrar la base
      if (!Array.isArray(DB.documents) || !DB.documents.length) { migrateDocuments(); persist("documents"); }
      ensureAccountMatch();                               // nunca mezclar demo/otra cuenta con la sesión real
      if (S.screen === "landing" && Auth.session()) {
        // Con sesión ya activa nunca se enseña la landing de marketing —
        // directo al dashboard (o a onboarding si la cuenta está vacía).
        S.screen = (DB.subjects && DB.subjects.length) ? "dashboard" : "onboarding";
      }
    })
    .catch(function () {})
    .then(function () { return Auth.consumeRedirect(); })
    .then(function (redirectResult) {
      setLang(DB.lang); applyAccent(); syncUser();
      if (redirectResult && redirectResult.ok) {
        // El usuario acaba de tocar el enlace de verificación del correo:
        // ya tiene sesión — trae sus datos reales (si los hay) y entra.
        render(); // splash -> pantalla "auth" momentánea mientras llega la nube
        return cloudPullAndHydrate().then(function () {
          S.screen = (DB.subjects && DB.subjects.length) ? "dashboard" : "onboarding";
          render();
        });
      }
      if (redirectResult && redirectResult.ok === false) {
        S.screen = "auth"; S.authMode = "signin"; S.authLinkError = true;
        render();
        return;
      }
      if (Auth.session()) {
        // Sesión ya guardada de una visita anterior: refresca desde la nube
        // (por si se usó otro dispositivo) sin bloquear el primer pintado.
        // El access_token dura ~1h — si ya ha caducado (o está a punto),
        // lo renovamos primero con el refresh_token para evitar una ráfaga
        // de 401 al hidratar y al hablar con Zynqora AI.
        var sess0 = Auth.session();
        var looksExpired = sess0 && sess0.at && sess0.expires_in &&
          (Date.now() - sess0.at) > (parseInt(sess0.expires_in, 10) * 1000 - 30000);
        var ready0 = looksExpired ? Auth.refresh().catch(function () {}) : Promise.resolve();
        render();
        return ready0.then(function () { return cloudPullAndHydrate(); }).then(function () {
          if (S.screen === "landing" || S.screen === "auth" || S.screen === "onboarding") { S.screen = (DB.subjects && DB.subjects.length) ? "dashboard" : "onboarding"; }
          render(true);
        });
      }
      render(); // sin sesión: render() fuerza la pantalla "auth" (cuenta obligatoria)
    })
    .catch(function (e) { try { render(); } catch (e2) {} })
    .then(function () {
      BOOTING = false; // a partir de aquí, cualquier cambio del usuario sí se sincroniza con Supabase
      try { window.addEventListener("beforeunload", function () { Store.flush(); }); } catch (e) {}
      try { window.addEventListener("pagehide", function () { Store.flush(); }); } catch (e) {}
    });
})();

</script>
